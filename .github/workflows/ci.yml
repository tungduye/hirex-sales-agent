# Copy to .github/workflows/ci.yml to enable GitHub Actions:
#   Copy-Item docs\ci-workflow.yml .github\workflows\ci.yml
name: CI

on:
  push:
  pull_request:

jobs:
  app:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # next-env.d.ts is generated by Next.js and ignored by git.
      - name: Generate Next.js type declarations
        run: npx next typegen || printf '/// <reference types="next" />\n/// <reference types="next/image-types/global" />\n' > next-env.d.ts
      - run: npm run typecheck
      - run: npm test
      # Lint is reported but not yet blocking; make it blocking once the existing warnings are cleaned up.
      - run: npm run lint
        continue-on-error: true

  sql:
    name: Migrations and SQL tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Apply every migration to a fresh database and run SQL tests
        run: bash supabase/tests/run-local.sh
