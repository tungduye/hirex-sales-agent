/*DP-CSS-BEGIN*/
.dpc,.dps{--dp-ac:var(--ui-primary,var(--ac,#2276c9));--dp-ach:var(--ui-primary-dark,var(--ah,#1b61a8));--dp-soft:var(--ui-primary-soft,var(--as,#eaf3fc));--dp-bd:var(--ui-border,var(--bd,#e3e8ef));--dp-sf:var(--ui-surface,var(--pn,#fff));--dp-hv:var(--ui-surface-hover,var(--hv,#f3f6fa));--dp-tx:var(--ui-text,var(--tx,#182230));--dp-mu:var(--ui-muted,var(--mu,#667085));--dp-none:var(--ui-none,#d4d4d8)}

.dpc{position:fixed;z-index:170;width:300px;background:var(--dp-sf);border:1px solid var(--dp-bd);border-radius:12px;box-shadow:0 12px 32px rgb(16 24 40/12%),0 2px 6px rgb(16 24 40/6%);padding:12px 14px 10px;color:var(--dp-tx);font-size:13px;user-select:none}

.dpc-h .dpc-t{flex:1;display:flex;justify-content:center;gap:2px}
.dpc .dpc-h .dpc-t button{height:28px;padding:0 8px;border-radius:6px;font-weight:600;display:inline-flex;align-items:center;gap:4px}

.dpc-nv{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;color:var(--dp-mu)}
.dpc-nv:hover{background:var(--dp-hv);color:var(--dp-tx)}
.dpc-nv:disabled{opacity:.35;pointer-events:none}
.dpc-w,.dpc-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.dpc-w{padding-bottom:6px;margin-bottom:4px;border-bottom:1px solid var(--dp-bd)}
.dpc-g{row-gap:2px}
.dpc-w i{font-style:normal;text-align:center;font-size:11px;font-weight:600;color:var(--dp-mu);padding:2px 0;letter-spacing:.02em}
.dpc .dpc-g button{height:36px;width:100%;position:relative;display:grid;place-items:center;font-variant-numeric:tabular-nums;border-radius:0;text-align:center}
.dpc-g button span{position:relative;z-index:1;display:grid;place-items:center;width:32px;height:32px;border-radius:8px;transition:background .1s}
.dpc-g button:hover span{background:var(--dp-hv)}
.dpc-g button.dp-o{color:var(--dp-mu);opacity:.45}
.dpc-g button.dp-t span{box-shadow:inset 0 0 0 1px var(--dp-ac);color:var(--dp-ac);font-weight:600}
.dpc-g button.dp-r::before{content:"";position:absolute;inset:2px 0;background:var(--dp-soft)}
.dpc-g button.dp-r:nth-child(7n+1)::before,.dpc-g button.dp-ra::before{left:3px;border-top-left-radius:8px;border-bottom-left-radius:8px}
.dpc-g button.dp-r:nth-child(7n)::before,.dpc-g button.dp-rb::before{right:3px;border-top-right-radius:8px;border-bottom-right-radius:8px}
.dpc-g button.dp-e span{background:var(--dp-ac)!important;color:var(--x-on-ink,#fff);font-weight:600}
.dpc-g button:disabled{opacity:.3;pointer-events:none}
.dpc-my{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px 0}
.dpc-my button{height:44px;border-radius:6px;font-variant-numeric:tabular-nums}
.dpc-my button:hover{background:var(--dp-hv)}
.dpc-my button.dp-t{color:var(--dp-ac);font-weight:600}
.dpc-my button.dp-e{background:var(--dp-ac);color:var(--x-on-ink,#fff);font-weight:600}
.dpc-my button:disabled{opacity:.3;pointer-events:none}
.dpc-f{display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px solid var(--dp-bd);margin-top:8px;padding:8px 0 0;font-size:12px;color:var(--dp-mu)}
.dpc .dpc-f button{height:26px;padding:0 8px;border-radius:6px;color:var(--dp-ac);font-weight:500}
.dpc-f button:hover{background:var(--dp-soft)}
.dpc-f button:disabled{opacity:.4;pointer-events:none}
/* nút mở lịch (dùng thay input date) */
.dpb{display:flex;align-items:center;gap:8px;width:100%;height:32px;padding:0 10px;border:1px solid var(--ui-border,var(--bd,#e3e8ef));border-radius:6px;background:var(--ui-surface,var(--pn,var(--x-surface,#fff)));color:var(--ui-text,var(--tx,#182230));font:inherit;cursor:pointer;text-align:left;font-variant-numeric:tabular-nums}

/* ── thanh trượt khoảng ── */
.dps{position:relative;padding:4px 0 0;touch-action:none}
.dps-h{display:flex;align-items:flex-end;gap:2px;height:52px;padding:0 8px;cursor:crosshair}

.dps-t{position:relative;height:24px;margin:0 8px;cursor:pointer}
.dps-t::before{content:"";position:absolute;left:0;right:0;top:10px;height:4px;border-radius:2px;background:var(--dp-bd)}

.dps-f:active{cursor:grabbing}
.dps-k{position:absolute;-webkit-appearance:none;appearance:none;top:4px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:var(--dp-sf);border:2px solid var(--dp-ac);box-shadow:0 1px 3px rgb(16 24 40/20%);cursor:grab;padding:0;outline:0}
.dps-k:focus-visible{box-shadow:0 0 0 3px var(--dp-soft),0 1px 3px rgb(16 24 40/20%)}
.dps-k:active{cursor:grabbing}
.dps-e{display:flex;justify-content:space-between;padding:2px 0 0;font-size:11.5px;color:var(--dp-mu);font-variant-numeric:tabular-nums}

.dps.drag .dps-tip{opacity:1}
</style></head><body>

 const P=n=>String(n).padStart(2,'0'),E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const SV=p=>`<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
 const I={l:SV('<path d="m15 6-6 6 6 6"/>'),r:SV('<path d="m9 6 6 6-6 6"/>'),d:SV('<path d="m6 9 6 6 6-6"/>'),c:SV('<rect x="3" y="4.5" width="18" height="16.5" rx="2.5"/><path d="M8 2.5v4M16 2.5v4M3 10h18"/>')};
 const ymd=d=>d.getFullYear()+'-'+P(d.getMonth()+1)+'-'+P(d.getDate());
 const pd=s=>{const m=/^(\d{4})-(\d\d)-(\d\d)/.exec(s||'');return m?new Date(+m[1],m[2]-1,+m[3]):null};
 const today=()=>ymd(new Date());
 const fmt=s=>{const m=/^(\d{4})-(\d\d)-(\d\d)/.exec(s||'');return m?m[3]+'/'+m[2]+'/'+m[1]:''};
 const parse=v=>{v=String(v??'').trim();let m=/^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(v);if(m)return m[1]+'-'+P(m[2])+'-'+P(m[3]);
  m=/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})/.exec(v);if(m)return m[3]+'-'+P(m[2])+'-'+P(m[1]);return null};
 const num=d=>Date.UTC(+d.slice(0,4),+d.slice(5,7)-1,+d.slice(8,10))/864e5,day=n=>new Date(Math.round(n)*864e5).toISOString().slice(0,10);
 const MN=['Th1','Th2','Th3','Th4','Th5','Th6','Th7','Th8','Th9','Th10','Th11','Th12'];
 let CUR=null;
 function close(){if(!CUR)return;const c=CUR;CUR=null;c.el.remove();c.anchor.classList.remove('open');document.removeEventListener('mousedown',c.md,true);document.removeEventListener('keydown',c.kd,true);c.o.onClose&&c.o.onClose()}
 /* o: {value, min, max, range:{a,b}, step:0|1, onPick(v), onRange(a,b,done)} */
 function cal(anchor,o){if(CUR&&CUR.anchor===anchor){close();return}close();
  const lo=o.min||'0000-01-01',hi=o.max||'9999-12-31',R=o.range?{a:o.range.a,b:o.range.b}:null;let step=o.step||0;
  const base=pd((R?(step?R.b:R.a):o.value)||'')||pd(hi<today()?hi:lo>today()?lo:today());let y=base.getFullYear(),m=base.getMonth(),view='d';
  const el=document.createElement('div');el.className='dpc';el.setAttribute('role','dialog');el.setAttribute('aria-label','Chọn ngày');
  (anchor.closest('.pop,#pop>div,.tvbox')||document.body).appendChild(el);anchor.classList.add('open');
  const out=k=>k<lo||k>hi,T=today();
  const draw=()=>{let h='',nav0=true,nav1=true;
   if(view==='d'){const f=new Date(y,m,1),s=new Date(y,m,1-((f.getDay()+6)%7));nav0=ymd(new Date(y,m,0))>=lo;nav1=ymd(new Date(y,m+1,1))<=hi;
    h=`<div class="dpc-w">${['T2','T3','T4','T5','T6','T7','CN'].map(x=>`<i>${x}</i>`).join('')}</div><div class="dpc-g">`+Array.from({length:42},(_,i)=>{const d=new Date(s.getFullYear(),s.getMonth(),s.getDate()+i),k=ymd(d);
     let c=d.getMonth()!==m?'dp-o':'';if(k===T)c+=' dp-t';const sel=R?(k===R.a||k===R.b):k===o.value;if(sel)c+=' dp-e';if(R&&R.a&&R.b&&k>=R.a&&k<=R.b&&d.getMonth()===m){c+=' dp-r';if(k===R.a)c+=' dp-ra';if(k===R.b)c+=' dp-rb'}
     return `<button type="button" class="${c}" data-d="${k}" ${out(k)?'disabled':''} aria-label="${fmt(k)}"><span>${d.getDate()}</span></button>`}).join('')+'</div>'}
   else if(view==='m'){nav0=y-1>=+lo.slice(0,4);nav1=y+1<=+hi.slice(0,4);const cm=pd(R?(step?R.b:R.a):o.value);
    h='<div class="dpc-my">'+MN.map((x,i)=>{const k1=y+'-'+P(i+1)+'-01',k2=ymd(new Date(y,i+1,0));return `<button type="button" data-m="${i}" class="${y===new Date().getFullYear()&&i===new Date().getMonth()?'dp-t':''} ${cm&&cm.getFullYear()===y&&cm.getMonth()===i?'dp-e':''}" ${k2<lo||k1>hi?'disabled':''}>Tháng ${i+1}</button>`}).join('')+'</div>'}
   else{const y0=y-y%12;nav0=y0-1>=+lo.slice(0,4);nav1=y0+12<=+hi.slice(0,4);const cy=(pd(R?(step?R.b:R.a):o.value)||new Date()).getFullYear();
    h='<div class="dpc-my">'+Array.from({length:12},(_,i)=>{const Y=y0+i;return `<button type="button" data-y="${Y}" class="${Y===new Date().getFullYear()?'dp-t':''} ${Y===cy?'dp-e':''}" ${Y<+lo.slice(0,4)||Y>+hi.slice(0,4)?'disabled':''}>${Y}</button>`}).join('')+'</div>'}
   const y0=y-y%12,title=view==='d'?`<button type="button" data-v="m" title="Chọn tháng">Tháng ${m+1}</button><button type="button" data-v="y" title="Chọn năm">${y}${I.d}</button>`:view==='m'?`<button type="button" data-v="y" title="Chọn năm">${y}${I.d}</button>`:`<button type="button" data-v="d">${y0} – ${y0+11}</button>`;
   const hint=R?(step?'Chọn ngày kết thúc':'Chọn ngày bắt đầu'):'';
   el.innerHTML=`<div class="dpc-h"><button type="button" class="dpc-nv" data-nv="-1" ${nav0?'':'disabled'} aria-label="Trước">${I.l}</button><div class="dpc-t">${title}</div><button type="button" class="dpc-nv" data-nv="1" ${nav1?'':'disabled'} aria-label="Sau">${I.r}</button></div>${h}<div class="dpc-f"><span>${hint}</span><button type="button" data-today ${out(T)?'disabled':''}>Hôm nay</button></div>`;if(el.isConnected&&el.style.top)place()};
  const place=()=>{const r=anchor.getBoundingClientRect(),w=el.offsetWidth,hh=el.offsetHeight;let x=r.left,yy=r.bottom+4;if(x+w>innerWidth-8)x=innerWidth-w-8;if(yy+hh>innerHeight-8)yy=Math.max(8,r.top-hh-4);el.style.left=Math.max(8,x)+'px';el.style.top=yy+'px'};
  const pick=k=>{if(!R){o.onPick&&o.onPick(k);close();return}
   if(step===0){R.a=k;if(!R.b||R.b<k)R.b=k;step=1;o.onRange&&o.onRange(R.a,R.b,false);const d=pd(k);y=d.getFullYear();m=d.getMonth();draw();return}
   if(k<R.a){R.b=R.a;R.a=k}else R.b=k;o.onRange&&o.onRange(R.a,R.b,true);close()};
  el.addEventListener('mousedown',e=>e.stopPropagation());
  el.addEventListener('click',e=>{e.stopPropagation();const b=e.target.closest('button');if(!b||b.disabled)return;
   if(b.dataset.nv){const d=+b.dataset.nv;if(view==='d'){m+=d;if(m<0){m=11;y--}if(m>11){m=0;y++}}else if(view==='m')y+=d;else y+=12*d;return draw()}
   if(b.dataset.v){view=b.dataset.v==='m'&&view==='m'?'d':b.dataset.v;return draw()}
   if(b.dataset.m!=null){m=+b.dataset.m;view='d';return draw()}
   if(b.dataset.y){y=+b.dataset.y;view='m';return draw()}
   if(b.dataset.today!==undefined)return pick(T);
   if(b.dataset.d)pick(b.dataset.d)});
  const md=e=>{if(!el.contains(e.target)&&!anchor.contains(e.target))close()};
  const kd=e=>{if(e.key==='Escape'){e.preventDefault();e.stopImmediatePropagation();close()}};
  document.addEventListener('mousedown',md,true);document.addEventListener('keydown',kd,true);
  CUR={el,anchor,o,md,kd};const d0=draw;draw();place();return el}
 /* thanh trượt khoảng: kéo 2 đầu, kéo cả đoạn, quét chọn trên biểu đồ, bấm 1 cột, phím ←/→ (Shift ×7, PgUp/PgDn ×30, Home/End) */
 function slider(host,o){const lo=o.lo,hi=o.hi,N=num(hi)-num(lo)+1;let a=Math.max(0,num(o.a||lo)-num(lo)),b=Math.min(N-1,num(o.b||hi)-num(lo));
  const days=o.days||new Map(),nb=Math.max(1,Math.min(o.bins||48,N)),bs=N/nb,bk=Array(nb).fill(0);
  days.forEach((n,d)=>{const i=num(d)-num(lo);if(i>=0&&i<N)bk[Math.min(nb-1,Math.floor(i/bs))]+=n});const mx=Math.max(...bk,1);
  host.innerHTML=`<div class="dps"><div class="dps-h">${bk.map((n,i)=>`<i data-i="${i}" style="height:${n?Math.max(8,n/mx*100):3}%" title="${fmt(day(num(lo)+Math.floor(i*bs)))}${bs>1.5?' – '+fmt(day(num(lo)+Math.min(N-1,Math.ceil((i+1)*bs)-1))):''}: ${n} dòng"></i>`).join('')}</div>
   <div class="dps-t"><div class="dps-f"></div><button type="button" class="dps-k" data-k="a" role="slider" aria-label="Từ ngày"></button><button type="button" class="dps-k" data-k="b" role="slider" aria-label="Đến ngày"></button></div>
   <div class="dps-e"><span>${fmt(lo)}</span><span>${fmt(hi)}</span></div><div class="dps-tip"></div></div>`;
  const R=host.firstChild,H=R.querySelector('.dps-h'),Tk=R.querySelector('.dps-t'),F=R.querySelector('.dps-f'),KA=R.querySelector('[data-k=a]'),KB=R.querySelector('[data-k=b]'),TIP=R.querySelector('.dps-tip'),bars=[...H.children];
  const pct=i=>N>1?i/(N-1)*100:50;
  const paint=(tip)=>{KA.style.left=pct(a)+'%';KB.style.left=pct(b)+'%';F.style.left=pct(a)+'%';F.style.width=(pct(b)-pct(a))+'%';
   KA.style.zIndex=a>=N-1?3:1;KB.style.zIndex=2;KA.setAttribute('aria-valuetext',fmt(day(num(lo)+a)));KB.setAttribute('aria-valuetext',fmt(day(num(lo)+b)));
   bars.forEach((el,i)=>{const s=Math.floor(i*bs),e=Math.ceil((i+1)*bs)-1;el.classList.toggle('dp-on',e>=a&&s<=b)});
   if(tip!=null){const i=tip==='a'?a:b;TIP.textContent=fmt(day(num(lo)+i));TIP.style.left=`calc(8px + (100% - 16px) * ${pct(i)/100})`}};
  const emit=fin=>{const A=day(num(lo)+a),B=day(num(lo)+b);(fin?o.onChange:o.onInput)&&(fin?o.onChange:o.onInput)(A,B)};
  const idx=(e,el)=>{const r=el.getBoundingClientRect(),pad=el===H?8:0,x=Math.min(1,Math.max(0,(e.clientX-r.left-pad)/(r.width-2*pad)));return Math.round(x*(N-1))};
  const drag=(e,mode,i0)=>{e.preventDefault();R.classList.add('drag');const a0=a,b0=b;let moved=false;
   const mv=ev=>{const i=idx(ev,mode==='brush'?H:Tk);moved=true;
    if(mode==='a'){a=Math.min(i,b)}else if(mode==='b'){b=Math.max(i,a)}
    else if(mode==='pan'){const d=i-i0,w=b0-a0;a=Math.max(0,Math.min(N-1-w,a0+d));b=a+w}
    else{a=Math.min(i0,i);b=Math.max(i0,i)}
    paint(mode==='b'||(mode==='brush'&&i>=i0)?'b':'a');emit(false)};
   const up=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);R.classList.remove('drag');
    if(mode==='brush'&&!moved){const bi=Math.min(nb-1,Math.floor(i0/bs));a=Math.floor(bi*bs);b=Math.min(N-1,Math.ceil((bi+1)*bs)-1);paint()}emit(true)};
   addEventListener('pointermove',mv);addEventListener('pointerup',up);paint(mode==='b'?'b':'a')};
  R.addEventListener('pointerdown',e=>{if(e.button!==0)return;
   if(e.target===KA)return drag(e,'a');if(e.target===KB)return drag(e,'b');
   if(e.target===F)return drag(e,'pan',idx(e,Tk));
   if(H.contains(e.target))return drag(e,'brush',idx(e,H));
   if(Tk.contains(e.target)){const i=idx(e,Tk);if(Math.abs(i-a)<=Math.abs(i-b)){a=Math.min(i,b);drag(e,'a')}else{b=Math.max(i,a);drag(e,'b')}paint();emit(false)}});
  R.addEventListener('keydown',e=>{const k=e.target.dataset&&e.target.dataset.k;if(!k)return;const st=e.shiftKey?7:1,map={ArrowLeft:-st,ArrowDown:-st,ArrowRight:st,ArrowUp:st,PageDown:-30,PageUp:30};
   let v=k==='a'?a:b;if(e.key in map)v+=map[e.key];else if(e.key==='Home')v=k==='a'?0:a;else if(e.key==='End')v=k==='a'?b:N-1;else return;e.preventDefault();
   if(k==='a')a=Math.max(0,Math.min(v,b));else b=Math.min(N-1,Math.max(v,a));paint();emit(true)});
  paint();
  return{set(A,B){a=Math.max(0,num(A)-num(lo));b=Math.min(N-1,num(B)-num(lo));paint()}}}
 return{cal,close,slider,parse,fmt,ymd,pd,num,day,today,icon:I.c,esc:E}})();
