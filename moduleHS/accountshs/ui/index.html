 const scr=`<span class="dva-s"><span class="dva-f ${dvTone(x)}" style="height:${t.cap?x.pc:0}%"></span><span class="dva-n"><b>${t.used}</b>${t.cap?`<i>&nbsp;/ ${t.cap}</i>`:''}</span>${big?`<span class="dva-l">${t.cap?Math.round(t.used/t.cap*100)+'% tải':'không giới hạn'}</span>`:''}</span>`;
 return `<span class="dva ${kind} ${big?'big':''}" aria-hidden="true">${kind==='boxphone'?`<span class="dva-rk"><i></i><i></i><i></i></span>`:''}${scr}${kind==='pc'?'<span class="dva-st"></span>':''}</span>`}
const dvQ=(q,act)=>`<${act?'button':'span'} class="dvq ${q.over?'over':''} ${q.n?'':'z'}" ${act?`data-a="devgo" data-d="${act}" data-t="${q.tt.id}"`:''} title="${esc(q.tt.name)}: ${q.n}${q.c?' / '+q.c:''}${q.over?' — vượt giới hạn':''}">${ico(q.tt.icon,13)}<span><b>${q.n}</b>${q.c?`<i>/${q.c}</i>`:''}</span></${act?'button':'span'}>`;

function renderDevices(m){
 const A=scoped();let assigned=0,unas=0;
 A.forEach(a=>{if(a.device_id&&I.dev[a.device_id])assigned++;else unas++});
 const all=devList(),st=all.map(dvInfo),cnt={free:0,full:0,over:0,idle:0};st.forEach(x=>cnt[x.k]++);
 let list=st.filter(x=>dvStateOk(x.k));
 const so=DVS.sort;
 if(so){const key=x=>so.k==='name'?x.d.name:so.k==='serial'?x.d.serial||'￿':so.k==='owner'?(I.own[x.d.owner_id]?.name||'￿'):so.k==='load'?(x.t.cap?x.t.used/x.t.cap:x.t.used?2:0):so.k==='state'?['over','full','free','idle'].indexOf(x.k):0;
  list=[...list].sort((a,b)=>{const p=key(a),q=key(b);return (typeof p==='number'?p-q:COLL.compare(String(p),String(q)))*so.d})}
 const shown=list.slice(0,lim('dv',500));
 let U=0,C=0;st.forEach(({t})=>{U+=t.used;if(t.cap)C+=t.cap});
 const tot=assigned+unas,cov=rpPct(assigned,tot),load=C?Math.min(100,Math.round(U/C*100)):0,kc={};all.forEach(d=>kc[d.kind]=(kc[d.kind]||0)+1);
 const warn=cnt.over?`<span class="dvx-n bad">${ico('alert',13)}${cnt.over} vượt giới hạn</span>`:cnt.full?`<span class="dvx-n bad">${cnt.full} máy đã đầy</span>`:'';
 const cell=(l,v,u,foot,attr='')=>`<${attr?'button':'div'} class="dvx-c ${attr?'lk':''}" ${attr}><span class="dvx-l">${l}</span><span class="dvx-v"><b>${v}</b>${u?`<em>${u}</em>`:''}</span>${foot}</${attr?'button':'div'}>`;
 const sum=`<div class="dvx">
  ${cell('Thiết bị',all.length,'máy',`<span class="dvx-s">${KINDS.filter(k=>kc[k]).map(k=>`<span title="${DKLAB[k]}">${ico(KIND[k],13)}${kc[k]}</span>`).join('')||'—'}${warn}</span>`)}
  ${cell('Đang chạy',U,C?`/ ${C} chỗ · ${load}%`:'',C?dvBarH(load,load>=100?'r':''):'<span class="dvx-s">Chưa đặt giới hạn</span>')}
  ${cell('Đã gắn máy',cov+'%',`${assigned} / ${tot} dòng`,dvBarH(cov,'g'))}
  ${cell('Chưa gắn máy',unas,'dòng',`<span class="dvx-s">${unas?`Xem danh sách${ico('chevr',13)}`:'Tất cả đã có máy'}</span>`,unas?'data-a="devgo" data-d="-1" title="Xem dòng chưa gắn máy"':'')}
 </div>`;
 const more=list.length>shown.length?`<div class="rp-more c">${moreBtn('dv',list.length-shown.length,500,'máy nữa')}</div>`:'';
 const empty=`<div class="empty">${ico('smartphone',30)}${S.devices.length?`<span>Không có thiết bị phù hợp</span><button class="btn outline" data-a="dvclr">${ico('x',15)}<span>Bỏ lọc</span></button>`:`<button class="btn pri" data-a="devadd">${ico('plus',16)}<span>Thêm</span></button>`}</div>`;
 m.innerHTML=`<div class="dvp dvp3">${sum}${!shown.length?empty:DVS.view==='list'?dvTable(shown,so)+more:`<div class="dvcg">${shown.map(dvCard).join('')}${more}</div>`}</div>`;}

const T={st:'idle',cv:null,cx:null,W:0,H:0,raf:0,last:0,t:0,t0:0,safety:0,sps:[],frames:[],sk:[],rings:[],spk:[],q:[],pool:[],free:[],rows2:[],twr:null,pl:0,rt:9,font:'12px system-ui',pad:8,rows:0,
 tok:[],seen:new Map(),done:new Set(),ms:new Set(),n:0,fid:0,fps:60,home:null,vis:false,retr:null,phT:0,phI:0,pc:0,fc:0,ft:0,bk:false,gear:'calm',gt:1,wn:.3,dt:.016,by:0,cfg:{on:true,delay:1.2,after:1.5,info:true,model:''},ts:0,csum:0,cn:0,timer:0,armed:false,fin:2.4,lod:0,sdt:0,grid:null,gs:0,cc:new WeakMap(),clipEls:null,clipT:0,fontOk:false,wc:new Map(),dv:{n:0,m:0,s:0},sa:0,sb:null};

/* ---------- nhện que: thân chữ nhật 24x8, 2 mắt đỏ ở 2 góc trước, 2 râu, 8 chân (4 cặp) 2 đốt IK ---------- */
function mkSpider(k,col){const L=[],hx=[9,3,-3,-9],rx=[27,12,-8,-26],ry=[22,31,31,22];
 for(let i=0;i<4;i++)for(const s of [-1,1])L.push({hx:hx[i],hy:s*4,rx:rx[i],ry:s*ry[i],side:s,g:(i+(s>0?1:0))%2,fx:null,fy:null,st:null,Hx:0,Hy:0,lift:0,hit:-9});
 return {x:0,y:0,ang:-Math.PI/2,sc:0,v:0,k,L,ph:'wait',pt:0,tg:null,vmax:3000,dw:.05,delay:0,col:col||'#22d3ee',main:false,mode:'crawl',force:null,sq:0,ox:0,oy:0,x1:0,y1:0,hops:0,launch:false,brake:true,chain:null,nb:null,
  fl:[-1,1].map(s=>({a:s*.55,s,p:rnd(0,TAU),bx:null,by:0,mx:0,my:0,tx:0,ty:0,c:null}))}}

/* ---------- canvas ---------- */
function mount(){if(T.cv)return;const c=document.createElement('canvas');c.id='ts-cv';document.body.appendChild(c);T.cv=c;T.cx=c.getContext('2d');size()}
function size(){if(!T.cv)return;const d=Math.min(window.devicePixelRatio||1,2);T.W=innerWidth;T.H=innerHeight;T.cv.width=T.W*d;T.cv.height=T.H*d;T.cx.setTransform(d,0,0,d,0,0)}
addEventListener('resize',()=>{size();T.rt=Math.max(T.rt,.2)});
addEventListener('scroll',()=>{T.rt=Math.max(T.rt,.14)},{capture:true,passive:true});   /* bảng cuộn -> đọc lại vị trí ô ngay, không để khung lệch chữ */
function home(){const e=document.querySelector('.ts-home');if(!e)return null;const r=e.getBoundingClientRect();if(!r.width||!r.height)return null;
 const b=document.querySelector('#aib');if(b){const q=b.getBoundingClientRect();if(r.bottom<q.top+4||r.top>q.bottom-4)return null}
 return {x:r.left+r.width/2,y:r.top+r.height/2}}

/* ---------- gán nhãn: lớp + độ tin cậy (ổn định theo nội dung ô) ---------- */
function clsOf(c){if(c.cl)return c.cl;const t=c.tx,f=c.f;let k;
 if(/^(live|die|dead|checkpoint|cp|ok|error|disable|banned|khoa|hoat dong)\b/.test(f))k='status';
 else if(t.indexOf('@')>0)k='email';
 else if(/^(https?:|www\.)/i.test(t))k='url';
 else if(/^\d{1,3}(\.\d{1,3}){3}(:\d+)?$/.test(t))k='ip';
 else if(/^\d{12,}$/.test(t))k='uid';
 else if(/^\+?\d[\d .\-]{8,13}$/.test(t))k='phone';
 else if(/^\d{1,6}$/.test(t))k='id';
 else if(/^\d[\d.,]*$/.test(t))k='num';
 else{const w=t.split(' ').length;k=(w>=2&&w<=4&&!/\d/.test(t))?'name':'text'}
 return c.cl=k}
function confOf(c,m){const h=hs(c.f+'|'+c.tx.length);return m?.9+(h%90)/1000:.62+(h%370)/1000}
function isMatch(c){return T.tok.length>0&&T.tok.some(w=>w.length>=3&&c.f.includes(w))}

/* ---------- bảng: chỉ ĐỌC. Chỉ lấy dòng HIỂN THỊ ĐỦ (dòng sát mép dưới bị che nửa -> bỏ) ---------- */
function hint(text){T.tok=fold(text).split(/[^a-z0-9]+/).filter(w=>w.length>=2&&!STOP.has(w));T.seen.clear();T.done.clear();T.ms.clear()}
function clipOf(tw){if(!T.clipEls||T.t-T.clipT>1.5){T.clipEls=[];T.clipT=T.t;let e=tw;       /* danh sách cha có overflow: chỉ dò 1.5s/lần (getComputedStyle đắt) */
  while(e&&e.nodeType===1&&e!==document.body){const cs=getComputedStyle(e),o=String(cs.overflowY)+String(cs.overflowX);if(/auto|scroll|hidden|clip/.test(o))T.clipEls.push(e);e=e.parentElement}}
 let l=0,t=0,r=T.W,b=T.H;for(const e of T.clipEls){const q=e.getBoundingClientRect();l=Math.max(l,q.left);t=Math.max(t,q.top);r=Math.min(r,q.right);b=Math.min(b,q.bottom)}
 return {l,t,r,b}}
/* lưới không gian 64px: tra ô theo toạ độ O(1) thay vì duyệt cả bảng mỗi chân / mỗi râu / mỗi khung hình */
const GS=64;
function buildGrid(){const g=new Map();for(const c of T.pool){const r=c.r,x0=Math.floor(r.left/GS),x1=Math.floor(r.right/GS),y0=Math.floor(r.top/GS),y1=Math.floor(r.bottom/GS);
  for(let gx=x0;gx<=x1;gx++)for(let gy=y0;gy<=y1;gy++){const k=(gx+8)*1024+gy+8;let a=g.get(k);if(!a){a=[];g.set(k,a)}a.push(c)}}T.grid=g}
function cellsNear(x,y,rad){const g=T.grid,out=[];if(!g)return out;const st=++T.gs;
 for(let gx=Math.floor((x-rad)/GS);gx<=Math.floor((x+rad)/GS);gx++)for(let gy=Math.floor((y-rad)/GS);gy<=Math.floor((y+rad)/GS);gy++){const a=g.get((gx+8)*1024+gy+8);if(!a)continue;for(const c of a){if(c.gst===st)continue;c.gst=st;out.push(c)}}
 return out}
function refreshPool(){const tw=document.querySelector('#tw');T.pool=[];T.free=[];T.rows2=[];if(!tw){T.twr=null;T.grid=null;return}
 T.twr=tw.getBoundingClientRect();const P=document.querySelector('.ai-p'),pr=P&&!P.hidden?P.getBoundingClientRect():null;T.pl=pr?pr.left:T.W;
 const C=clipOf(tw),ths=tw.querySelectorAll('thead th'),tb=tw.querySelectorAll('tbody tr');T.rows=tb.length;
 let top=Math.max(C.t,64);if(ths.length){const q=ths[0].getBoundingClientRect();if(q.bottom>top&&q.bottom<T.H)top=q.bottom}
 const bot=C.b-3;
 for(const tr of tb){const r=tr.getBoundingClientRect();if(r.height<8||r.top<top-1||r.bottom>bot)continue;     /* chỉ dòng nằm trọn trong khung nhìn */
  const row={tr,top:r.top,cells:[],ix:(tr.sectionRowIndex||0)+1};
  for(const td of tr.cells){const q=td.getBoundingClientRect();if(q.width<30||q.height<8||q.left<C.l+2||q.right>C.r-2)continue;
   const tx=(td.textContent||'').replace(/\s+/g,' ').trim();if(!tx||tx.length>80)continue;
   const inP=!!pr&&q.right>pr.left&&q.left<pr.right&&q.bottom>pr.top&&q.top<pr.bottom;if(inP)continue;
   let c=T.cc.get(td);
   if(!(c&&c.tx===tx&&Math.abs(c.r.left-q.left)<.5&&Math.abs(c.r.top-q.top)<.5&&Math.abs(c.r.width-q.width)<.5&&Math.abs(c.r.height-q.height)<.5)){   /* ô không đổi -> dùng lại (giữ cache nhãn + khung chữ) */
    c={el:td,tr,r:{left:q.left,top:q.top,right:q.right,bottom:q.bottom,width:q.width,height:q.height},tx,f:fold(tx),cx:q.left+q.width/2,cy:q.top+q.height/2,tr2:null,cl:null,inP:false,gst:0};T.cc.set(td,c)}
   T.pool.push(c);row.cells.push(c)}
  if(row.cells.length){row.cells.sort((a,b)=>a.cx-b.cx);T.rows2.push(row)}}
 T.rows2.sort((a,b)=>b.top-a.top);                                       /* dòng dưới cùng trước -> quét từ dưới lên */
 T.free=T.pool;
 const td0=T.pool[0]&&T.pool[0].el;if(td0&&!T.fontOk){T.fontOk=true;const cs=getComputedStyle(td0);T.font=(cs.fontWeight||'400')+' '+(cs.fontSize||'12px')+' '+(cs.fontFamily||'system-ui');T.pad=parseFloat(cs.paddingLeft)||8}
 buildGrid()}
function trect(c){if(c.tr2)return c.tr2;let r=null;
 try{const g=document.createRange();g.selectNodeContents(c.el);const q=g.getBoundingClientRect();if(q.width>2&&q.height>2)r={left:Math.max(c.r.left,q.left)-2,top:q.top-1,right:Math.min(c.r.right,q.right)+2,bottom:q.bottom+1}}catch(e){}
 if(!r)r={left:c.r.left+3,top:c.r.top+2,right:c.r.right-3,bottom:c.r.bottom-2};
 r.width=r.right-r.left;r.height=r.bottom-r.top;r.cx=(r.left+r.right)/2;r.cy=(r.top+r.bottom)/2;return c.tr2=r}
function cellAt(x,y){const g=T.grid;if(!g)return null;const a=g.get((Math.floor(x/GS)+8)*1024+Math.floor(y/GS)+8);if(!a)return null;for(const c of a){const r=c.r;if(x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom)return c}return null}
function cellNear(x,y,rad){let b=null,bd=rad*rad;for(const c of cellsNear(x,y,rad)){const d=(c.cx-x)*(c.cx-x)+(c.cy-y)*(c.cy-y);if(d<bd){bd=d;b=c}}return b}
/* khung detection: màu theo lớp (khớp câu hỏi -> xanh lá), nhãn "lớp conf", o.par = thêm dòng tham số, o.lab = bắt buộc hiện nhãn */
function addFrame(c,col,o){o=o||{};const k=clsOf(c),m=col===MATCH||isMatch(c);T.n++;if(m&&!T.ms.has(c.el)){T.ms.add(c.el);T.csum+=Math.min(.99,confOf(c,m));T.cn++}
 T.frames.push({r:c.r,b:trect(c),col:m?MATCH:CLS[k],t:T.t,life:o.life||.6,gl:o.gl||0,tx:c.tx,sw:!!o.sw,hit:!!o.hit,par:!!o.par,lab:!!o.lab,cl:(m?'match:':'')+k,conf:Math.min(.99,confOf(c,m)),id:++T.fid});
 if(T.frames.length>(MAXF>>T.lod))T.frames.shift()}

/* ---------- hiệu ứng chạm: dấu ngắm 4 tick + hạt vuông (không sóng nước, không glow) ---------- */
function punch(x,y,sp,pw){if(T.pc>18||sp.sc<.8)return;pw=pw||1;T.pc++;const c=cellAt(x,y),k=Math.max(.6,sp.k);
 T.rings.push({x,y,t:T.t,life:.3+.08*pw,r:(14+12*pw)*k,col:sp.col});if(T.rings.length>70)T.rings.shift();
 const n=(3+((pw*3)|0))>>T.lod;for(let i=0;i<n;i++){const a=rnd(0,TAU),v=rnd(120,380)*pw;T.spk.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:T.t,life:rnd(.16,.38),col:i%3?sp.col:INK})}
 if(T.spk.length>240)T.spk.splice(0,T.spk.length-240);
 if(c&&T.t-(T.seen.get(c.el)||-9)>.25){T.seen.set(c.el,T.t);addFrame(c,sp.col,{life:.9,gl:R()<.55?.2:0,hit:true})}}
function skid(sp,v0){const a=sp.ang+Math.PI;for(let i=0;i<8;i++){const b=a+rnd(-.5,.5),v=rnd(180,600)*Math.min(1.4,v0/3000);T.spk.push({x:sp.x,y:sp.y,vx:Math.cos(b)*v,vy:Math.sin(b)*v,t:T.t,life:rnd(.15,.33),col:i%2?INK:sp.col})}
 T.rings.push({x:sp.x,y:sp.y,t:T.t,life:.28,r:24*sp.k,col:sp.col})}
/* tơ nhện: sợi mảnh bắn từ thân tới một ô, đầu tơ là ô vuông ngắm + khung nhãn */
function spoke(sp,c,col,dl,life){const b=trect(c);T.sk.push({x0:sp.x,y0:sp.y,x1:b.cx,y1:b.cy,t:T.t+(dl||0),life:life||.9,col,c,boxed:false,seed:R()*9});if(T.sk.length>110)T.sk.shift()}

/* ---------- chọn đích: chính quét TỪ DƯỚI LÊN theo từng dòng; bầy nhện quét theo ô gần nhất ---------- */
function nextMain(sp,jump){const rows=T.rows2;if(!rows.length)return null;let ri=0;
 for(;ri<rows.length;ri++)if(rows[ri].cells.some(c=>!T.done.has(c.el)))break;
 if(ri>=rows.length){T.done.clear();ri=0}
 ri=Math.min(rows.length-1,ri+(jump||0));
 const cs=rows[ri].cells.filter(c=>!T.done.has(c.el)),l=(cs.length?cs:rows[ri].cells).slice().sort((a,b)=>Math.abs(a.cx-sp.x)-Math.abs(b.cx-sp.x));return l[0]}
function pickTarget(sp,jump){const pool=T.pool;
 if(!pool.length){const hm=T.home||{x:T.W/2,y:T.H/2};return {x:hm.x+rnd(-140,140),y:hm.y+rnd(-110,110),c:null,col:sp.col}}
 const hit=c=>T.tok.find(w=>w.length>=3&&c.f.includes(w))||null;let c;
 const m=pool.filter(x=>!T.done.has(x.el)&&hit(x));
 if(sp.main){c=(m.length&&R()<.22)?pick(m):nextMain(sp,jump)}
 else{const fr=pool.filter(x=>T.t-(T.seen.get(x.el)||-9)>1);c=pick((fr.length?fr:pool).map(x=>[Math.hypot(x.cx-sp.x,x.cy-sp.y),x]).sort((a,b)=>a[0]-b[0]).slice(0,4))[1]}
 if(!c)c=pick(pool);T.done.add(c.el);const tok=hit(c),b=trect(c);return {x:b.cx,y:b.cy,c,col:tok?MATCH:sp.col,tok:!!tok}}
function randCell(){if(T.pool.length){const c=pick(T.pool),b=trect(c);return {x:b.cx,y:b.cy}}const hm=T.home||{x:T.W/2,y:T.H/2};return {x:hm.x+rnd(-160,160),y:hm.y+rnd(-120,120)}}

/* ---------- chuyển động ---------- */
function turn(sp,tx,ty,rate,dt){const da=wrap(Math.atan2(ty-sp.y,tx-sp.x)-sp.ang);sp.ang+=clamp(da,-rate*dt,rate*dt)}
function move(sp,tx,ty,vmax,rate,dt,done,brake){const dx=tx-sp.x,dy=ty-sp.y,d=Math.hypot(dx,dy);turn(sp,tx,ty,rate,dt);
 const acc=vmax*9,want=brake===false?vmax:Math.min(vmax,Math.sqrt(acc*d)+40);sp.v+=clamp(want-sp.v,-acc*dt*1.5,acc*dt);
 const al=Math.max(0,Math.cos(wrap(Math.atan2(dy,dx)-sp.ang))),v=sp.v*(.3+.7*al),s=Math.min(d,v*dt);
 if(d>.001){sp.x+=dx/d*s;sp.y+=dy/d*s}if(d<6||s>=d-.01)done()}
function chooseMode(sp){if(sp.force){const m=sp.force;sp.force=null;return m}
 const storm=T.gear==='storm',r=R();
 if(storm)return r<.4?'dash':r<.62?'zip':r<.8?'spin':'burst';
 return r<.4?'crawl':r<.62?'dash':r<.78?'burst':r<.9?'zip':'spin'}
function arrive(sp){const tg=sp.tg,v0=sp.v;sp.v=0;sp.hops++;
 if(tg.c){const b=trect(tg.c);addFrame(tg.c,tg.col,{life:1.1,gl:.22,hit:true,par:true});T.rings.push({x:b.cx,y:b.cy,t:T.t,life:.36,r:30*sp.k,col:tg.col})}
 if((sp.mode==='dash'||sp.mode==='zip')&&v0>1500)skid(sp,v0);
 if(sp.mode==='zip'){sp.chain='burst'}else if(sp.mode==='dash'&&R()<.5){sp.chain='spin'}
 sp.ph='dwell';sp.pt=0;sp.dw=sp.mode==='crawl'?rnd(.12,.3):rnd(.03,.09)}
function nearCells(sp,n,rad){return cellsNear(sp.x,sp.y,rad).map(c=>[Math.hypot(c.cx-sp.x,c.cy-sp.y),c]).filter(a=>a[0]<rad).sort((a,b)=>a[0]-b[0]).slice(0,n).map(a=>a[1])}
function stepSp(sp,dt,hm){const ph=sp.ph;sp.sq=Math.max(0,sp.sq-dt*4);
 if(ph==='wait'){sp.delay-=dt;if(sp.delay<=0){sp.ph=sp.launch?'launch':'spawn';sp.pt=0}}
 else if(ph==='spawn'){sp.pt+=dt;const k=clamp(sp.pt/.45,0,1);sp.sc=easeBack(k);sp.x=hm.x;sp.y=hm.y;sp.ang=-Math.PI/2+Math.sin(k*10)*.3*(1-k);if(k>=1)sp.ph='plan'}
 else if(ph==='launch'){sp.pt+=dt;const k=clamp(sp.pt/.26,0,1),e=1-Math.pow(1-k,3);sp.sc=Math.min(1,k*3);sp.x=sp.ox+(sp.x1-sp.ox)*e;sp.y=sp.oy+(sp.y1-sp.oy)*e;sp.ang=Math.atan2(sp.y1-sp.oy,sp.x1-sp.ox);sp.v=2600*(1-k);
  if(k>=1){sp.ph='plan';T.rings.push({x:sp.x,y:sp.y,t:T.t,life:.4,r:40*sp.k,col:sp.col});skid(sp,2600)}}
 else if(ph==='plan'){const mode=chooseMode(sp);sp.mode=mode;
  if(mode==='burst'){sp.ph='burst';sp.pt=0;sp.sq=.9;const cs=nearCells(sp,6+((R()*6)|0),250);cs.forEach((c,i)=>{spoke(sp,c,pick(COL),i*.022,.95);T.done.add(c.el)});T.rings.push({x:sp.x,y:sp.y,t:T.t,life:.4,r:56*sp.k,col:sp.col})}
  else if(mode==='spin'){sp.ph='spin';sp.pt=0;T.rings.push({x:sp.x,y:sp.y,t:T.t,life:.45,r:70*sp.k,col:sp.col});T.rings.push({x:sp.x,y:sp.y,t:T.t+.1,life:.45,r:44*sp.k,col:INK})}
  else{const tg=pickTarget(sp,mode==='zip'?2+((R()*2)|0):0);sp.tg=tg;
   sp.vmax=mode==='crawl'?rnd(380,950):mode==='zip'?rnd(4800,6200):rnd(3400,5200);sp.brake=mode==='crawl';
   T.sk.push({x0:sp.x,y0:sp.y,x1:tg.x,y1:tg.y,t:T.t,life:mode==='zip'?.7:.35,col:sp.col,c:null,boxed:true,seed:R()*9,zip:mode==='zip'});if(T.sk.length>110)T.sk.shift();
   sp.ph='move'}}
 else if(ph==='move')move(sp,sp.tg.x,sp.tg.y,sp.vmax,sp.mode==='crawl'?18:46,dt,()=>arrive(sp),sp.brake);
 else if(ph==='burst'){sp.pt+=dt;if(sp.pt>=.34){sp.ph='dwell';sp.pt=0;sp.dw=.03}}
 else if(ph==='spin'){sp.pt+=dt;sp.ang+=TAU*dt/.34;if(sp.pt>=.34){const cs=nearCells(sp,5,200);cs.forEach((c,i)=>spoke(sp,c,pick(COL),i*.02,.8));sp.ph='dwell';sp.pt=0;sp.dw=.05}}
 else if(ph==='dwell'){sp.pt+=dt;if(sp.pt>=sp.dw){if(sp.chain){sp.force=sp.chain;sp.chain=null}sp.ph='plan'}}
 else if(ph==='back')move(sp,hm.x,hm.y,3800,36,dt,()=>{sp.ph='shrink';sp.pt=0;sp.v=0},false);
 else if(ph==='shrink'){sp.pt+=dt;const k=clamp(sp.pt/.3,0,1);sp.sc=1-k*k;sp.x=hm.x;sp.y=hm.y;sp.ang+=dt*16;if(k>=1)sp.ph='dead'}}
/* chân: bước = nhấc (lùi lại lấy đà) -> đâm nhanh xuống ô -> chạm thì ping.  Đứng yên cũng đâm liên tục xuống các ô quanh thân */
function startStep(l,sp,x1,y1,d,pw){l.st={x0:l.fx,y0:l.fy,x1,y1,t:0,d,pw}}
function legs(sp,dt){const sz=SZ*sp.k*sp.sc,c=Math.cos(sp.ang),s=Math.sin(sp.ang),free=sp.sc<.98;let any=0;
 const pr=sp.ph==='dwell'?15:sp.ph==='burst'?30:sp.ph==='spin'?55:0;
 for(const l of sp.L)if(l.st)any|=1<<l.g;
 for(const l of sp.L){const hx=sp.x+(c*l.hx-s*l.hy)*sz,hy=sp.y+(s*l.hx+c*l.hy)*sz,rx=sp.x+(c*l.rx-s*l.ry)*sz,ry=sp.y+(s*l.rx+c*l.ry)*sz;l.Hx=hx;l.Hy=hy;
  if(free||l.fx==null){l.fx=rx;l.fy=ry;l.st=null;continue}
  if(l.st){const S=l.st;S.t+=dt/S.d;const u=clamp(S.t,0,1),wx=S.x0+(sp.x-S.x0)*.12,wy=S.y0+(sp.y-S.y0)*.12;
   if(u<.28){const e=Math.sin(u/.28*Math.PI/2);l.fx=S.x0+(wx-S.x0)*e;l.fy=S.y0+(wy-S.y0)*e}
   else{const k=(u-.28)/.72,e=k*k*k;l.fx=wx+(S.x1-wx)*e;l.fy=wy+(S.y1-wy)*e}
   l.lift=Math.sin(u*Math.PI);
   if(u>=1){l.st=null;l.lift=0;l.hit=T.t;punch(l.fx,l.fy,sp,S.pw||1)}continue}
  const d=Math.hypot(l.fx-rx,l.fy-ry),other=any&(1<<(1-l.g));

 const raw=Math.min(.05,(ts-(T.last||ts))/1000);T.last=ts;T.sdt=T.sdt?T.sdt+(raw-T.sdt)*.35:raw;const dt=Math.min(.034,T.sdt);T.dt=dt;T.t+=dt;   /* dt làm mượt: bớt giật do rAF lệch nhịp */

 if(!T.raf)T.raf=requestAnimationFrame(loop)}

function finish(){clearTimeout(T.safety);T.st='done';clearAll();hide();const r=T.retr;T.retr=null;if(r)r()}
function reset(){clearTimeout(T.safety);clearTimeout(T.timer);T.timer=0;T.armed=false;T.st='idle';clearAll();hide();const r=T.retr;T.retr=null;if(r)r()}

function cslot(){const ph=(((performance.now()-T.ts)/1000)%2.6).toFixed(2);   /* 1 vòng tới-lui = 2.6s: khung bị vẽ lại vẫn giữ đúng pha thanh chạy */
 return '<div class="ts-slot"><div class="ts-home"></div><div class="ts-tx"><b class="ts-ti">Thinking...</b>'+(T.cfg.model?'<span class="ts-md"><em>Model</em> <b>'+String(T.cfg.model).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))+'</b></span>':'')+(T.cfg.info!==false?statsHtml():'')+'<div class="ts-bar"><i style="animation-delay:-'+ph+'s"></i></div></div></div>'}
function arm(){T.timer=0;if(T.st!=='idle'||T.armed||!T.cfg.on||RM)return;T.armed=true;const w=document.getElementById('ts-wrap');if(w)w.innerHTML=cslot();begin();const bx=document.getElementById('aib');if(bx)bx.scrollTop=bx.scrollHeight}   /* khung cao hơn 3 chấm -> cuộn xuống để không bị ô nhập che */
function retract(){clearTimeout(T.timer);T.timer=0;
 if(RM||T.st!=='run')return Promise.resolve();                              /* AI trả lời trước giờ hiện hiệu ứng -> không hiệu ứng */
 if(!(T.cfg.after>0)||!home()){reset();return Promise.resolve()}   /* after = 0 (hoặc khung chat đang ẩn / thu nhỏ): tắt ngay */
 return new Promise(res=>{T.retr=res;T.fin=Math.max(.15,T.cfg.after-.45);T.safety=setTimeout(finish,T.fin*1000+3000);startFin()})}
function sync(busy){if(RM)return;
 if(busy){if(T.st==='idle'&&!T.timer&&!T.armed&&T.cfg.on){T.ts=performance.now();const d=+T.cfg.delay||0;if(d>0)T.timer=setTimeout(arm,d*1000);else arm()}return}
 clearTimeout(T.timer);T.timer=0;
 if(T.st==='done'){T.st='idle';T.armed=false;const m=document.querySelectorAll('#aib .ai-m'),l=m[m.length-1];if(l)l.classList.add('ts-pop');return}
 if(T.st!=='idle')reset();T.armed=false}
function slot(){const d='<div class="ai-dots"><i></i><i></i><i></i></div>';
 return '<div id="ts-wrap" class="ts-wrap">'+((RM||!T.cfg.on||!T.armed||T.st==='done')?d:cslot())+'</div>'}
function config(o){o=o||{};const n=(v,d)=>v==null||isNaN(+v)?d:Math.max(0,+v);T.cfg={on:o.on!==false,delay:n(o.delay,1.2),after:n(o.after,1.5),info:o.info!==false,model:o.model?String(o.model).slice(0,80):''}}
console.info('[Think_Amation] v3.1 đã nạp');

 setTimeout(()=>retract().then(()=>{const e=document.getElementById('ts-test');if(e)e.remove();sync(false)}),4500);return 'Dang chay thu 4.5s...'}
