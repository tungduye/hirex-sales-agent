<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>aHS</title>
<style>
:root{--bg:#fff;--bg2:#fafafa;--fg:#09090b;--mut:#f4f4f5;--mf:#71717a;--bd:#e4e4e7;--pri:#0ea5e9;--r:8px;--ok:#10b981;--err:#ef4444}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:13px/1.45 Inter,ui-sans-serif,system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--fg);background:var(--bg2);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
svg.i{flex:none;display:block}
#app{display:flex;flex-direction:column;height:100vh}
.grow{flex:1}
.mut{color:var(--mf)}
.ph{color:var(--x-faint,#a1a1aa);display:inline-flex;align-items:center}
.ph.pad{padding:12px;justify-content:center;width:100%}
/* top */
#top{display:flex;align-items:center;gap:10px;height:56px;padding:0 16px;background:var(--bg);border-bottom:1px solid var(--bd);flex:none}
.brand{width:30px;height:30px;border-radius:8px;background:var(--pri);color:var(--x-on-ink,#fafafa);display:grid;place-items:center;flex:none}
.vsep{width:1px;height:22px;background:var(--bd);flex:none}
.tabs{display:flex;gap:2px;padding:3px;background:var(--mut);border-radius:10px;overflow-x:auto;scrollbar-width:none;min-width:0}
.tab{height:30px;padding:0 11px;border:0;background:none;border-radius:7px;display:flex;align-items:center;gap:7px;color:var(--mf);font-weight:500;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--fg)}
.tab.on{background:var(--x-surface,#fff);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08),0 0 0 1px rgba(0,0,0,.03)}
.tab.on svg{color:var(--c,var(--fg))}
.tab em{font-style:normal;font-size:11px;color:var(--x-faint,#a1a1aa);font-variant-numeric:tabular-nums}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:32px;padding:0 12px;border-radius:var(--r);border:1px solid var(--bd);background:var(--x-surface,#fff);cursor:pointer;font-weight:500;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{background:var(--mut)}
.btn:disabled{opacity:.4;pointer-events:none}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--x-on-ink,#fafafa)}
.btn.pri:hover{background:var(--x-accent,#0284c7)}
.btn.danger{background:var(--x-danger,#dc2626);border-color:var(--x-danger,#dc2626);color:var(--x-on-ink,#fff)}
.btn.danger:hover{background:var(--x-danger,#b91c1c)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--mut)}
.btn.icon{width:32px;padding:0}
.btn.sm{height:28px;padding:0 8px}
.btn.icon.sm{width:28px;padding:0}
.deptbtn{padding:0 8px;gap:8px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none}
/* bar */
#bar{display:flex;align-items:center;gap:10px;padding:12px 16px;flex:none;flex-wrap:wrap}
.search{position:relative;width:240px}
.search svg{position:absolute;left:10px;top:9px;color:var(--x-faint,#a1a1aa)}
.search input{padding-left:32px}
.in{height:34px;padding:0 10px;border:1px solid var(--bd);border-radius:var(--r);background:var(--x-surface,#fff);font:inherit;color:inherit;width:100%;outline:none}
.in:focus{border-color:var(--x-line-2,#a1a1aa);box-shadow:0 0 0 3px rgba(24,24,27,.07)}
textarea.in{height:auto;padding:8px 10px;resize:vertical}
select.in{padding-right:6px}
.in.sm{height:28px;width:auto}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border:1px solid var(--bd);background:var(--x-surface,#fff);border-radius:999px;cursor:pointer;font-weight:500}
.chip:hover{background:var(--mut)}
.chip.on{background:var(--pri);color:var(--x-on-ink,#fafafa);border-color:var(--pri)}
.chip em{font-style:normal;font-size:11px;opacity:.6;font-variant-numeric:tabular-nums}
/* table */
.main{flex:1;min-height:0;padding:0 16px}
.main.gp{padding:0 16px 16px}
.tw{height:100%;overflow:auto;background:var(--x-surface,#fff);border:1px solid var(--bd);border-radius:10px}
table.grid{border-collapse:separate;border-spacing:0;width:100%}
.grid th{position:sticky;top:0;z-index:2;background:var(--bg2);border-bottom:1px solid var(--bd);padding:0 12px;height:38px;text-align:left;font-size:12px;font-weight:500;color:var(--mf);white-space:nowrap;cursor:pointer;user-select:none}
.grid th>*{vertical-align:middle}
.grid th svg{display:inline-block;margin-right:6px;opacity:.8}
.grid th:hover{color:var(--fg)}
.grid td{padding:0 12px;height:46px;border-bottom:1px solid var(--bd);white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis}
.grid tr.vsp td{height:auto;padding:0;border:0;max-width:none}.grid tr.vsp{background:none!important}
.grid tr:last-child td{border-bottom:0}
.grid tbody tr:hover td{background:var(--bg2)}
.grid tbody tr.sel td{background:var(--mut)}
.grid .c-chk{width:44px;padding:0 0 0 14px}
.grid .c-st{width:130px}
.grid .c-act{width:76px;text-align:right}
.grid .c-time{color:var(--x-faint,#a1a1aa);font-size:12px;width:60px}
.grid .c-note{max-width:180px;color:var(--mf)}
.grid .c-in{max-width:none}
.grid td .btn{opacity:0}
.grid tr:hover td .btn{opacity:1}
.mini{opacity:0;border:0;background:none;padding:2px;margin-left:4px;border-radius:4px;cursor:pointer;color:var(--x-faint,#a1a1aa);vertical-align:middle}
.mini:hover{background:var(--bd);color:var(--fg)}
td:hover .mini{opacity:1}
.txt.prim{font-weight:500}
.sec.mask{letter-spacing:1px;color:var(--x-faint,#a1a1aa)}
.sec{font-family:inherit;font-size:13px;font-variant-numeric:tabular-nums;letter-spacing:0}
.lkv{display:inline-flex;align-items:center;gap:5px;color:var(--ui-muted)}.lkv svg{color:var(--ui-primary)}.lkv .sec{color:var(--ui-text)}
.tag{display:inline-block;padding:1px 8px;border-radius:6px;background:var(--mut);font-size:12px}
.in-inline{width:100%;height:30px;border:1px solid var(--x-line-2,#a1a1aa);border-radius:6px;padding:0 8px;font:inherit;outline:none;box-shadow:0 0 0 3px rgba(24,24,27,.07)}
td.editing{overflow:visible}
.chk{width:16px;height:16px;border:1.5px solid var(--x-line-2,#a1a1aa);border-radius:4px;background:var(--x-surface,#fff);display:inline-grid;place-items:center;padding:0;cursor:pointer;color:var(--x-on-ink,#fff);vertical-align:middle}
.chk:hover{border-color:var(--fg)}
.chk.on,.chk.part{background:var(--pri);border-color:var(--pri)}
.chk .bar{width:8px;height:2px;background:var(--x-surface,#fff);border-radius:1px}
.pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 6px 0 9px;border-radius:999px;border:1px solid var(--bd);background:var(--x-surface,#fff);cursor:pointer;font-weight:500}
.pill:hover{background:var(--mut)}
.pill svg{color:var(--x-faint,#a1a1aa)}
.lchip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px 0 3px;border-radius:999px;border:1px solid var(--bd);background:var(--x-surface,#fff);cursor:pointer;margin-right:4px;vertical-align:middle;max-width:190px}
.lchip:hover{border-color:var(--c,var(--x-line-2,#a1a1aa));background:var(--bg2)}
.lchip span:nth-child(2){overflow:hidden;text-overflow:ellipsis}
.lchip.more{padding:0 8px;color:var(--mf)}
.ci{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--c,#71717a) 14%,var(--x-surface,#fff));color:var(--c,var(--x-muted,#71717a));flex:none}
.inb{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 8px 0 7px;border-radius:999px;border:1px solid color-mix(in srgb,var(--c) 30%,var(--x-surface,#fff));background:color-mix(in srgb,var(--c) 8%,var(--x-surface,#fff));color:var(--c);cursor:pointer;margin-right:4px;vertical-align:middle}
.inb:hover{background:color-mix(in srgb,var(--c) 16%,var(--x-surface,#fff))}
.inb b{font-weight:600;color:var(--fg);font-size:12px}
.inb .dots{display:inline-flex;gap:2px;margin-left:2px}
.inb .dots i{width:6px;height:6px;border-radius:50%}
tr.flash td{animation:fl 2.2s ease-out}
@keyframes fl{0%,35%{background:var(--x-warn-soft,#fef9c3)}100%{background:transparent}}
.empty{display:flex;flex-direction:column;align-items:center;gap:12px;padding:70px 0;color:var(--x-faint,#a1a1aa)}
.empty p{margin:0}
#foot{display:flex;align-items:center;gap:8px;height:48px;padding:0 20px;flex:none;color:var(--mf)}
#foot span.pg{min-width:54px;text-align:center;font-variant-numeric:tabular-nums}
/* floating selection bar */
#sel{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:none;align-items:center;gap:2px;padding:6px;background:var(--pri);color:var(--x-on-ink,#fafafa);border-radius:12px;box-shadow:0 12px 32px -8px rgba(0,0,0,.4);z-index:40}
#sel.on{display:flex}
#sel .btn{color:var(--x-on-ink,#fafafa);border:0;background:transparent;opacity:1}
#sel .btn:hover{background:var(--x-ink,#3f3f46)}
#sel .cnt{padding:0 10px 0 8px;font-weight:600;display:flex;align-items:center;gap:6px}
#sel .vs{width:1px;height:18px;background:var(--x-ink,#3f3f46);margin:0 4px}
/* popover / menu */
.pop{position:fixed;z-index:120;min-width:190px;max-width:320px;background:var(--x-surface,#fff);border:1px solid var(--bd);border-radius:10px;box-shadow:0 12px 32px -10px rgba(0,0,0,.22),0 2px 6px rgba(0,0,0,.05);padding:4px;max-height:70vh;overflow:auto}
.mi{display:flex;align-items:center;gap:9px;width:100%;padding:7px 9px;border:0;background:none;border-radius:6px;text-align:left;cursor:pointer}
.mi:hover{background:var(--mut)}
.mi.danger{color:var(--x-danger,#dc2626)}
.mi .r{margin-left:auto;color:var(--mf)}
.mi .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mi em{font-style:normal;color:var(--x-faint,#a1a1aa);font-size:11px;margin-left:auto}
.sep{height:1px;background:var(--bd);margin:4px -4px}
.mh{padding:6px 9px 3px;font-size:11px;color:var(--x-faint,#a1a1aa)}
.picker{width:270px}
.psearch{position:relative;padding:2px 2px 4px}
.psearch svg{position:absolute;left:10px;top:11px;color:var(--x-faint,#a1a1aa)}
.psearch input{padding-left:30px;height:32px}
.plist{max-height:260px;overflow:auto}
.pfoot{display:flex;justify-content:flex-end;padding:4px 2px 2px;border-top:1px solid var(--bd);margin-top:4px}
.colrow{display:flex;align-items:center;gap:9px;width:100%;padding:7px 9px;border:0;background:none;border-radius:6px;cursor:pointer;text-align:left}
.colrow:hover{background:var(--mut)}
.icgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;width:210px}
.icgrid button{height:38px;border:0;background:none;border-radius:6px;cursor:pointer;display:grid;place-items:center}
.icgrid button:hover,.icgrid button.on{background:var(--mut)}
/* overlay, sheet, modal */
.overlay{position:fixed;inset:0;background:rgba(9,9,11,.45);z-index:60;display:flex;justify-content:flex-end}
.overlay.c{justify-content:center;align-items:center}
.overlay.top{z-index:110}
.sheet{width:min(440px,100%);height:100%;background:var(--x-surface,#fff);display:flex;flex-direction:column;box-shadow:-12px 0 40px -12px rgba(0,0,0,.3);animation:slin .16s ease-out}
@keyframes slin{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
.sheet header,.modal header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--bd)}
header h3{margin:0;font-size:15px;font-weight:600}
.ti{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 14%,var(--x-surface,#fff));color:var(--c)}
.sbody{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.sheet footer,.modal footer{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--bd)}
.fld label{display:flex;align-items:center;gap:6px;font-weight:500;margin-bottom:6px;color:var(--mf);font-size:12px}
.chips2{display:flex;gap:6px;flex-wrap:wrap}
.lbox{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.lbox .lchip{margin:0}
.lchip .x{border:0;background:none;padding:0;margin-left:2px;color:var(--x-faint,#a1a1aa);cursor:pointer;display:grid}
.lchip .x:hover{color:var(--x-danger,#dc2626)}
.sec-in{display:flex;gap:4px}
.modal{background:var(--x-surface,#fff);border-radius:14px;width:min(720px,94vw);max-height:88vh;display:flex;flex-direction:column;box-shadow:0 24px 60px -12px rgba(0,0,0,.35);overflow:hidden}
.modal.wide{width:min(900px,95vw);height:min(640px,88vh)}
.modal.sm{width:min(380px,92vw)}
.mbody{flex:1;overflow:auto;padding:16px}
.cmsg{margin:4px 0 8px;font-size:14px}
/* bulk */
.bctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.bctl .in{width:auto}
.sepin{width:56px!important;text-align:center;font-family:inherit}
.fmtrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:10px;border:1px dashed var(--bd);border-radius:10px;background:var(--bg2);margin-bottom:8px}
.fchip{display:inline-flex;align-items:center;gap:2px;height:28px;padding:0 4px 0 8px;border-radius:7px;background:var(--x-surface,#fff);border:1px solid var(--bd);font-weight:500}
.fchip button{border:0;background:none;padding:3px;border-radius:4px;cursor:pointer;color:var(--x-faint,#a1a1aa);display:grid}
.fchip button:hover{background:var(--mut);color:var(--fg)}
.fchip.off{border-style:dashed;color:var(--mf);padding:0 8px;cursor:pointer}
.fchip.off:hover{background:var(--mut)}
.fmtpat{font-family:inherit;font-size:12px;color:var(--mf);margin:0 0 8px;overflow:auto;white-space:nowrap}
#btext{font-family:inherit;font-size:12px;min-height:170px;white-space:pre}
.bprev{margin-top:12px;border:1px solid var(--bd);border-radius:10px;overflow:auto}
.bprev table{border-collapse:collapse;width:100%}
.bprev th,.bprev td{padding:6px 10px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap;font-size:12px}
.bprev th{background:var(--bg2);color:var(--mf);font-weight:500}
.bprev tr:last-child td{border-bottom:0}
.sw{width:34px;height:20px;border-radius:999px;background:var(--x-fill,#d4d4d8);border:0;position:relative;cursor:pointer;padding:0;transition:background .15s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--x-surface,#fff);transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw.on{background:var(--pri)}
.sw.on::after{transform:translateX(14px)}
.lab{display:flex;align-items:center;gap:7px;color:var(--mf)}
/* settings */
.sg{display:flex;flex:1;min-height:0}
.snav{width:150px;border-right:1px solid var(--bd);padding:10px;display:flex;flex-direction:column;gap:2px;flex:none}
.snav button{display:flex;align-items:center;gap:9px;height:34px;padding:0 10px;border:0;background:none;border-radius:7px;cursor:pointer;color:var(--mf);font-weight:500;text-align:left}
.snav button:hover{background:var(--mut)}
.snav button.on{background:var(--mut);color:var(--fg)}
.spane{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
.srow{display:flex;align-items:center;gap:8px}
.srow .in{flex:1;min-width:0}
.srow .in.w{flex:none;width:130px}
.srow .ghosty{visibility:hidden}
input.clr{width:34px;height:34px;padding:2px;border:1px solid var(--bd);border-radius:8px;background:var(--x-surface,#fff);cursor:pointer;flex:none}
.kb{width:22px;color:var(--x-warn,#f59e0b);display:grid;place-items:center;flex:none}
.icb{width:34px;height:34px;border:1px solid var(--bd);border-radius:8px;background:var(--x-surface,#fff);cursor:pointer;display:grid;place-items:center;flex:none}
.icb:hover{background:var(--mut)}
.tsel{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
/* graph */
.gwrap{position:relative;height:100%;display:flex;flex-direction:column;background:var(--x-surface,#fff);border:1px solid var(--bd);border-radius:10px;overflow:hidden}
.gbar{display:flex;align-items:center;gap:12px;padding:8px 12px;border-bottom:1px solid var(--bd);background:var(--x-surface,#fff);flex:none;min-height:50px;flex-wrap:wrap}
.gtitle{display:flex;align-items:center;gap:8px;font-weight:600}
.groots{display:flex;gap:4px}
.seg{display:inline-flex;padding:3px;background:var(--mut);border-radius:8px;gap:2px}
.seg button{min-width:28px;height:26px;border:0;background:none;border-radius:6px;cursor:pointer;color:var(--mf);font-weight:500}
.seg button.on{background:var(--x-surface,#fff);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.gleg{display:flex;gap:4px}
.lg{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 8px;border-radius:999px;border:1px solid color-mix(in srgb,var(--c) 35%,var(--x-surface,#fff));background:color-mix(in srgb,var(--c) 9%,var(--x-surface,#fff));color:var(--c);cursor:pointer}
.lg b{color:var(--fg);font-weight:600;font-size:12px}
.lg.off{background:var(--x-surface,#fff);border-color:var(--bd);color:var(--x-faint,#a1a1aa);text-decoration:line-through}
.gsvg{flex:1;width:100%;min-height:0;cursor:grab;touch-action:none;background-image:radial-gradient(var(--x-fill,#e4e4e7) 1px,transparent 1px);background-size:22px 22px}
.gsvg:active{cursor:grabbing}
.ge{stroke-width:2.2;stroke-linecap:round;opacity:.85;transition:opacity .15s}
.gn{cursor:pointer;transition:opacity .15s}
.gn .gl{font-size:11px;fill:var(--x-text,#27272a);paint-order:stroke;stroke:var(--x-surface,#fff);stroke-width:4px;stroke-linejoin:round;pointer-events:none}
.gel{font-size:10px;fill:var(--x-muted,#71717a);paint-order:stroke;stroke:var(--x-surface,#fff);stroke-width:3px;opacity:0;pointer-events:none}
.gel.show,.gwrap.few .gel{opacity:1}
.dim{opacity:.12}
.gtip{position:absolute;z-index:5;display:flex;align-items:center;gap:8px;padding:6px 10px 6px 6px;background:var(--x-surface,#fff);border:1px solid var(--bd);border-radius:10px;box-shadow:0 8px 24px -8px rgba(0,0,0,.25);pointer-events:none;white-space:nowrap}
.gtip em{font-style:normal;color:var(--mf)}
.gempty{position:absolute;inset:50px 0 0 0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--x-faint,#a1a1aa);pointer-events:none}
.gov{padding:24px}
.gcard{width:100%;height:100%;animation:pop .14s ease-out}
@keyframes pop{from{transform:scale(.98);opacity:0}to{transform:none;opacity:1}}
#toast{position:fixed;right:18px;bottom:18px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{display:flex;align-items:center;gap:8px;padding:9px 14px;background:var(--pri);color:var(--x-on-ink,#fafafa);border-radius:10px;box-shadow:0 8px 24px -8px rgba(0,0,0,.4);animation:slin .16s ease-out}
.toast.err{background:var(--x-danger,#dc2626)}
@media (prefers-reduced-motion:never-match){*{animation:none!important;transition:none!important}}
/* ===== v2 ===== */
:root{--pri-h:#0284c7;--pri-s:#e0f2fe;--pri-b:#bae6fd;--pri-t:#0369a1}
.toast,.toast.err{background:var(--x-surface,#fff);color:var(--x-danger,#b91c1c);border:1px solid var(--bd);box-shadow:0 8px 24px -10px rgba(15,23,42,.25)}
.btn.pri{border-color:var(--pri)}.btn.pri:hover{border-color:var(--pri-h)}
.in:focus,.in-inline:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(14,165,233,.18)}
.in-inline{border-color:var(--pri);box-shadow:0 0 0 3px rgba(14,165,233,.18)}
#sel .btn:hover{background:rgba(255,255,255,.2)}#sel .vs{background:rgba(255,255,255,.3)}
#sel{background:var(--pri-h)}
.chip.on{background:var(--pri);border-color:var(--pri)}
.grid tbody tr.sel td{background:var(--x-info-soft,#f0f9ff)}
.grid tbody tr.sel:hover td{background:var(--x-info-soft,#e0f2fe)}
.grid td,.grid th{user-select:none}
.in-inline,.grid td input{user-select:text}
.brandt{font-weight:700;font-size:16px;letter-spacing:-.2px;color:var(--pri-t);padding:0 6px 0 2px;white-space:nowrap}
#top{gap:8px}
.scp{max-width:300px;gap:7px;padding:0 10px}

/* ===== v3: màu & chữ ===== */

.dv-ti b{font-size:13px;font-weight:500}
.dv-ti>span{font-size:11.5px}
.dv-bd,.dv-bd.ok,.dv-bd.warn,.dv-bd.danger,.dv-bd.mut{background:none;border:0;padding:0;font-size:11.5px;color:var(--ui-muted)}
.dv-bd.danger{color:var(--ui-danger)}
.dv-ow{font-size:12px;color:var(--ui-muted)}
.dv-ow .oi{width:16px;height:16px}
.dv-dp{display:none}
.dv-sum{gap:6px}
.dv-big{font-size:15px;font-weight:500}.dv-big em{font-size:13px}
.dv-sl{font-size:11.5px}
.dv-bar{height:4px}
.dv-card.full .dv-bar i,.dv-card.over .dv-bar i{background:var(--ui-primary)}
.dv-card.over .dv-bar i{background:var(--ui-danger)}
.dv-us{gap:0;padding-top:6px}
.dv-u{grid-template-columns:18px minmax(0,1fr) auto;padding:4px 2px;font-size:12px}
.dv-ub{display:none}
.dv-u b{font-weight:400;color:var(--ui-text)}
.dv-u.over b{color:var(--ui-danger)}
.dv-nu{border:0;padding-top:0;font-size:11.5px}
.dv-card footer{margin-top:0}

/* ===== v12: thanh lọc thống nhất · tab Thiết bị làm mới ===== */
/* mọi điều khiển trong thanh công cụ cùng cao 34px, cùng bo 6px */
#bar{align-items:center;row-gap:var(--ui-s2)}
#bar>.btn,#bar>.search .in,#bar .seg{height:34px}
#bar>.btn.icon{width:34px;padding:0}
#bar>.btn{border-radius:var(--ui-radius-sm)}
#bar>.btn.fbtn{width:auto!important;padding:0 11px}
#bar .seg.dvkseg{padding:3px;display:inline-flex;align-items:center}
#bar .seg.dvkseg button{height:26px;display:inline-flex;align-items:center;gap:6px;padding:0 9px}
#bar .seg.dvkseg button em{font-style:normal;font-size:11.5px;color:var(--ui-muted);font-variant-numeric:tabular-nums}
#bar .seg.dvkseg button.on{color:var(--ui-primary-dark)}
#bar .seg.dvkseg button.on em{color:var(--ui-primary-dark)}
/* nút mở/thu: chevron xoay 180° */
.btn.cvt{gap:7px;padding:0 10px;font-weight:500}
.btn.cvt svg.i.cv{transition:transform .18s ease;color:var(--ui-muted)}
.btn.cvt.on svg.i.cv{transform:rotate(180deg)}
.btn.cvt.on,.btn.cvt.act{background:var(--ui-primary-soft);border-color:var(--ui-primary-line);color:var(--ui-primary-dark)}
.btn.cvt.on svg.i.cv,.btn.cvt.act svg.i.cv{color:var(--ui-primary)}
.btn.cvt b.cb{min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--ui-primary);color:var(--x-on-ink,#fff);font-size:11px;font-weight:600;display:grid;place-items:center}
/* hàng chip nhanh: xuống hàng riêng, mảnh, một tông */
.fchrow{flex:0 0 100%;display:flex;flex-wrap:wrap;gap:6px;padding-top:2px;animation:fchin .16s ease-out}
@keyframes fchin{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.fchrow .chip{height:28px;padding:0 10px;gap:6px;font-size:12.5px;font-weight:400;border-radius:var(--ui-radius-sm);color:var(--ui-muted);background:var(--ui-surface);border:1px solid var(--ui-border)}
.fchrow .chip:hover{background:var(--ui-surface-hover);color:var(--ui-text)}
.fchrow .chip.on,.fchrow .chip.on:hover{background:var(--ui-primary-soft);border-color:var(--ui-primary-line);color:var(--ui-primary-dark);font-weight:500}
.fchrow .chip em{font-size:11px;font-style:normal;font-variant-numeric:tabular-nums;color:var(--ui-muted);opacity:.9}
.fchrow .chip.on em{color:var(--ui-primary-dark)}
.fchrow .chip svg{stroke-width:1.5}
@media (prefers-reduced-motion:never-match){.btn.cvt svg.i.cv{transition:none}.fchrow{animation:none}}

/* --- tab Thiết bị --- */
.dvp2{padding:0 2px var(--ui-s5);gap:var(--ui-s3);overflow:auto}
.dvks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--ui-s3);flex:none}
.dvk{position:relative;display:grid;grid-template-columns:36px 1fr;grid-template-rows:auto auto auto;column-gap:var(--ui-s3);align-items:center;text-align:left;padding:14px 16px;background:var(--ui-surface);border:1px solid var(--ui-border);border-radius:var(--ui-radius-lg);font:inherit;color:inherit;min-width:0}
button.dvk{cursor:pointer}button.dvk:hover{border-color:var(--ui-primary-line);background:var(--ui-surface-hover)}
.dvk-i{grid-row:1/3;width:36px;height:36px;border-radius:var(--ui-radius-sm);display:grid;place-items:center;background:var(--ui-surface-hover);color:var(--ui-muted)}
.dvk-t{display:flex;flex-direction:column;min-width:0}
.dvk-t b{font-size:20px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums;line-height:1.2}
.dvk-t b em{font-style:normal;font-size:13px;color:var(--ui-muted);font-weight:500}
.dvk-t>span{font-size:12px;color:var(--ui-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dvk small{grid-column:2;font-size:11.5px;color:var(--ui-muted);margin-top:2px}
.dvk small .neg{color:var(--ui-danger)}
.dvk-b{grid-column:1/3;display:block;height:4px;border-radius:999px;background:var(--ui-surface-hover);overflow:hidden;margin-top:10px}
.dvk-b i{display:block;height:100%;background:var(--ui-primary);border-radius:999px}
.dvk.full .dvk-b i{background:var(--ui-warning)}
.dvk.warnk .dvk-i{color:var(--ui-warning);background:var(--ui-warning-soft)}
.dv-tw{flex:none;height:auto;overflow:visible}
.dv-tw .grid td{height:54px}
.dvp2 tr[data-dev]{cursor:default}
.dvn{display:inline-flex;align-items:center;gap:10px;min-width:0}
.dvn-i{width:30px;height:30px;border-radius:var(--ui-radius-sm);display:grid;place-items:center;background:var(--ui-surface-hover);color:var(--ui-muted);flex:none}
.dvn-t{display:flex;flex-direction:column;min-width:0;line-height:1.3}
.dvn-t b{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.dvn-t>span{display:flex;align-items:center;gap:2px;font-size:11.5px;color:var(--ui-muted)}
.dvn-t code{font:inherit}
.dvo{display:inline-flex;align-items:center;gap:7px}
.dvo em{font-style:normal;color:var(--ui-muted);font-size:11.5px}
.dvo em::before{content:"·";margin-right:6px}
.dvl{display:inline-flex;align-items:center;gap:10px}
.dvl-n{min-width:50px;font-variant-numeric:tabular-nums;color:var(--ui-muted)}.dvl-n b{color:var(--ui-text);font-weight:600}
.dvl-b{width:96px;height:6px;border-radius:999px;background:var(--ui-surface-hover);overflow:hidden;display:block}
.dvl-b i{display:block;height:100%;border-radius:999px;background:var(--ui-primary)}
.dvl.full .dvl-b i{background:var(--ui-warning)}.dvl.over .dvl-b i{background:var(--ui-danger)}.dvl.over .dvl-n b{color:var(--ui-danger)}
.dvs{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ui-text)}
.dvs i{width:8px;height:8px;border-radius:50%;background:var(--ui-success);flex:none}
.dvs.idle i{background:var(--ui-edge)}.dvs.full i{background:var(--ui-warning)}.dvs.over i{background:var(--ui-danger)}.dvs.over{color:var(--ui-danger)}
.dvt{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 8px;margin-right:4px;border:1px solid var(--ui-border);border-radius:var(--ui-radius-sm);background:var(--ui-surface);color:var(--ui-muted);cursor:pointer;font:inherit;font-size:12px}
.dvt:hover{border-color:var(--ui-primary-line);background:var(--ui-primary-soft);color:var(--ui-primary-dark)}
.dvt b{font-weight:600;color:var(--ui-text);font-variant-numeric:tabular-nums}.dvt b i{font-style:normal;font-weight:400;color:var(--ui-muted)}
.dvt.over{border-color:#EDC4C4;background:var(--ui-danger-soft)}.dvt.over b,.dvt.over b i{color:var(--ui-danger)}
.dv-tw .c-act .btn{opacity:0}.dv-tw tr:hover .c-act .btn,.dv-tw tr:focus-within .c-act .btn{opacity:1}
@media(max-width:1100px){.dvks{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.dvks{grid-template-columns:1fr}}

/* ===== v13: toolbar kiểu Postman — nhẹ, một tông, cùng font với ô tìm kiếm ===== */
:root{--ui-text-2:#475467}
#bar .search .in{border-radius:var(--ui-radius-sm);font-size:13px;font-weight:400}
#bar>.btn:not(.pri):not(.danger){background:var(--ui-surface);border:1px solid var(--ui-border);color:var(--ui-text-2);font-weight:400;font-size:13px;box-shadow:none}
#bar>.btn:not(.pri):not(.danger):hover{background:var(--ui-surface-hover);color:var(--ui-text)}
#bar>.btn:not(.pri):not(.danger) svg.i{color:var(--ui-muted);stroke-width:1.6}
#bar>.btn:not(.pri):not(.danger):hover svg.i{color:var(--ui-text-2)}
#bar>.btn.ghost{border-color:transparent;background:transparent}
#bar>.btn.pri{font-weight:500;font-size:13px}
#bar>.btn.fbtn.on,#bar>.btn.cvt.on,#bar>.btn.cvt.act{background:var(--ui-primary-soft);border-color:var(--ui-primary-line);color:var(--ui-primary-dark)}
#bar>.btn.fbtn.on svg.i,#bar>.btn.cvt.on svg.i,#bar>.btn.cvt.act svg.i{color:var(--ui-primary)}
.btn.cvt{font-weight:400}
/* nhóm lọc loại thiết bị: cùng chiều cao, cùng viền, bo 6px với ô tìm kiếm */
#bar .seg.dvkseg{height:34px;padding:2px;gap:2px;border:1px solid var(--ui-border);background:var(--ui-surface);border-radius:var(--ui-radius-sm)}
#bar .seg.dvkseg button{height:28px;min-width:0;padding:0 10px;border:0;border-radius:4px;background:transparent;color:var(--ui-muted);font-weight:400;box-shadow:none}
#bar .seg.dvkseg button svg.i{color:var(--ui-muted);stroke-width:1.6}
#bar .seg.dvkseg button:hover{background:var(--ui-surface-hover);color:var(--ui-text-2)}
#bar .seg.dvkseg button.on,#bar .seg.dvkseg button.on:hover{background:var(--ui-primary-soft);border:0;box-shadow:none;color:var(--ui-primary-dark)}
#bar .seg.dvkseg button.on svg.i{color:var(--ui-primary)}
#bar .seg.dvkseg button em{font-size:12px;font-weight:400}
/*DP-CSS-BEGIN*/
.dpc,.dps{--dp-ac:var(--ui-primary,var(--ac,#2276c9));--dp-ach:var(--ui-primary-dark,var(--ah,#1b61a8));--dp-soft:var(--ui-primary-soft,var(--as,#eaf3fc));--dp-bd:var(--ui-border,var(--bd,#e3e8ef));--dp-sf:var(--ui-surface,var(--pn,#fff));--dp-hv:var(--ui-surface-hover,var(--hv,#f3f6fa));--dp-tx:var(--ui-text,var(--tx,#182230));--dp-mu:var(--ui-muted,var(--mu,#667085));--dp-none:var(--ui-none,#d4d4d8)}
/* ── lịch ── */
.dpc{position:fixed;z-index:170;width:300px;background:var(--dp-sf);border:1px solid var(--dp-bd);border-radius:12px;box-shadow:0 12px 32px rgb(16 24 40/12%),0 2px 6px rgb(16 24 40/6%);padding:12px 14px 10px;color:var(--dp-tx);font-size:13px;user-select:none}
.dpc button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;margin:0}
.dpc-h{display:flex;align-items:center;gap:4px;height:32px;margin-bottom:8px}
.dpc-h .dpc-t{flex:1;display:flex;justify-content:center;gap:2px}
.dpc .dpc-h .dpc-t button{height:28px;padding:0 8px;border-radius:6px;font-weight:600;display:inline-flex;align-items:center;gap:4px}
.dpc-h .dpc-t button:hover{background:var(--dp-hv)}
.dpc-h .dpc-t button svg{color:var(--dp-mu)}
.dpc-nv{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;color:var(--dp-mu)}
.dpc-nv:hover{background:var(--dp-hv);color:var(--dp-tx)}
.dpc-nv:disabled{opacity:.35;pointer-events:none}
.dpc-w,.dpc-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.dpc-w{padding-bottom:6px;margin-bottom:4px;border-bottom:1px solid var(--dp-bd)}
.dpc-g{row-gap:2px}
.dpc-w i{font-style:normal;text-align:center;font-size:11px;font-weight:600;color:var(--dp-mu);padding:2px 0;letter-spacing:.02em}
.dpc .dpc-g button{height:36px;width:100%;position:relative;display:grid;place-items:center;font-variant-numeric:tabular-nums;border-radius:0;text-align:center}
.dpc-g button span{position:relative;z-index:1;display:grid;place-items:center;width:32px;height:32px;border-radius:8px;transition:background .1s}
.dpc-g button:hover span{background:var(--dp-hv)}
.dpc-g button.dp-o{color:var(--dp-mu);opacity:.45}
.dpc-g button.dp-t span{box-shadow:inset 0 0 0 1px var(--dp-ac);color:var(--dp-ac);font-weight:600}
.dpc-g button.dp-r::before{content:"";position:absolute;inset:2px 0;background:var(--dp-soft)}
.dpc-g button.dp-r:nth-child(7n+1)::before,.dpc-g button.dp-ra::before{left:3px;border-top-left-radius:8px;border-bottom-left-radius:8px}
.dpc-g button.dp-r:nth-child(7n)::before,.dpc-g button.dp-rb::before{right:3px;border-top-right-radius:8px;border-bottom-right-radius:8px}
.dpc-g button.dp-e span{background:var(--dp-ac)!important;color:var(--x-on-ink,#fff);font-weight:600}
.dpc-g button:disabled{opacity:.3;pointer-events:none}
.dpc-my{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px 0}
.dpc-my button{height:44px;border-radius:6px;font-variant-numeric:tabular-nums}
.dpc-my button:hover{background:var(--dp-hv)}
.dpc-my button.dp-t{color:var(--dp-ac);font-weight:600}
.dpc-my button.dp-e{background:var(--dp-ac);color:var(--x-on-ink,#fff);font-weight:600}
.dpc-my button:disabled{opacity:.3;pointer-events:none}
.dpc-f{display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px solid var(--dp-bd);margin-top:8px;padding:8px 0 0;font-size:12px;color:var(--dp-mu)}
.dpc .dpc-f button{height:26px;padding:0 8px;border-radius:6px;color:var(--dp-ac);font-weight:500}
.dpc-f button:hover{background:var(--dp-soft)}
.dpc-f button:disabled{opacity:.4;pointer-events:none}
/* nút mở lịch (dùng thay input date) */
.dpb{display:flex;align-items:center;gap:8px;width:100%;height:32px;padding:0 10px;border:1px solid var(--ui-border,var(--bd,#e3e8ef));border-radius:6px;background:var(--ui-surface,var(--pn,var(--x-surface,#fff)));color:var(--ui-text,var(--tx,#182230));font:inherit;cursor:pointer;text-align:left;font-variant-numeric:tabular-nums}
.dpb svg{color:var(--ui-muted,var(--mu,#667085))}
.dpb:hover{border-color:var(--ui-edge,#9aa8ba)}
.dpb.open{border-color:var(--ui-primary,var(--ac,#2276c9));box-shadow:0 0 0 3px var(--ui-primary-soft,var(--as,#eaf3fc))}
/* ── thanh trượt khoảng ── */
.dps{position:relative;padding:4px 0 0;touch-action:none}
.dps-h{display:flex;align-items:flex-end;gap:2px;height:52px;padding:0 8px;cursor:crosshair}
.dps-h i{flex:1;min-width:1px;background:var(--dp-none);border-radius:2px 2px 0 0}
.dps-h i.dp-on{background:var(--dp-ac)}
.dps-h i:hover{filter:brightness(.92)}
.dps-t{position:relative;height:24px;margin:0 8px;cursor:pointer}
.dps-t::before{content:"";position:absolute;left:0;right:0;top:10px;height:4px;border-radius:2px;background:var(--dp-bd)}
.dps-f{position:absolute;top:10px;height:4px;border-radius:2px;background:var(--dp-ac);cursor:grab}
.dps-f:active{cursor:grabbing}
.dps-k{position:absolute;-webkit-appearance:none;appearance:none;top:4px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:var(--dp-sf);border:2px solid var(--dp-ac);box-shadow:0 1px 3px rgb(16 24 40/20%);cursor:grab;padding:0;outline:0}
.dps-k:focus-visible{box-shadow:0 0 0 3px var(--dp-soft),0 1px 3px rgb(16 24 40/20%)}
.dps-k:active{cursor:grabbing}
.dps-e{display:flex;justify-content:space-between;padding:2px 0 0;font-size:11.5px;color:var(--dp-mu);font-variant-numeric:tabular-nums}
.dps-tip{position:absolute;top:-24px;transform:translateX(-50%);padding:2px 7px;border-radius:6px;background:var(--dp-tx);color:var(--x-on-ink,#fff);font-size:11.5px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .1s;font-variant-numeric:tabular-nums}
.dps.drag .dps-tip{opacity:1}
/*DP-CSS-END*/
/* ===== Đính kèm ===== */
.c-att{max-width:340px;overflow:hidden}
.attl{display:flex;align-items:center;gap:6px;min-width:0;max-width:100%}
.attc{--fc:#71717a;display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px 0 3px;border:1px solid var(--bd);border-radius:999px;background:var(--x-surface,#fff);min-width:0;max-width:150px;flex:0 1 auto;cursor:pointer;font:inherit;font-size:12px;color:var(--fg);transition:border-color .12s,background .12s}
.attc:hover{border-color:var(--fc);background:color-mix(in srgb,var(--fc) 6%,var(--x-surface,#fff))}
.attc .atti{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--fc);background:color-mix(in srgb,var(--fc) 14%,var(--x-surface,#fff))}
.attc .attnm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ft-xlsx{--fc:#16a34a}.ft-docx{--fc:#2563eb}.ft-pdf{--fc:#dc2626}.ft-img{--fc:#9333ea}.ft-text{--fc:#64748b}.ft-video,.ft-audio{--fc:#ea580c}
.attm{display:inline-flex;align-items:center;gap:3px;height:26px;padding:0 9px;border:1px solid var(--bd);border-radius:999px;background:var(--mut);font:inherit;font-size:12px;font-weight:600;color:var(--mf);cursor:pointer;flex:none}
.attm:hover{color:var(--fg);border-color:var(--x-line-2,#d4d4d8)}
.dkv .attl{flex-wrap:wrap}.dkv .attc{max-width:260px}
.attbox{display:flex;flex-direction:column;gap:6px;padding:8px;border:1px dashed var(--bd);border-radius:var(--r);background:var(--bg2);transition:border-color .12s,background .12s}
.attbox.over{border-color:var(--pri);background:color-mix(in srgb,var(--pri) 7%,var(--x-surface,#fff))}
.attr{display:flex;align-items:center;gap:8px;height:34px;padding:0 4px 0 8px;background:var(--x-surface,#fff);border:1px solid var(--bd);border-radius:7px;min-width:0}
.attr .atti{display:grid;place-items:center;color:var(--mf);flex:none}
.attr .attn{flex:1;min-width:0;text-align:left;border:0;background:none;font:inherit;font-size:13px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:inherit}
.attr .attn:hover{color:var(--pri)}
.attr em{font-style:normal;font-size:12px;color:var(--mf);flex:none}
.attr.up{color:var(--mf);font-size:13px;gap:10px}
.attadd{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;border-radius:7px;cursor:pointer;color:var(--fg);font-size:13px;font-weight:500}
.attadd:hover{background:var(--mut)}
.attadd em{font-style:normal;font-weight:400;font-size:12px;color:var(--mf);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spin1{width:16px;height:16px;border:2px solid var(--bd);border-top-color:var(--pri);border-radius:50%;animation:rl .7s linear infinite;flex:none;display:inline-block}
.attwin{z-index:140;min-width:380px;min-height:260px}
.attwin .tvh .attnm{min-width:0;overflow:hidden;text-overflow:ellipsis}
.attwin .tvh .tsep{height:20px;margin:0 2px}
.attwin .tvh>.i{flex:none}
.attwin .tvf .attmeta{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.attpg{font-size:12px;color:var(--mf);min-width:34px;text-align:center;font-variant-numeric:tabular-nums}
.attbody{flex:1;min-height:0;overflow:hidden;background:var(--bg2);display:flex;flex-direction:column}
.attbody iframe{flex:1;width:100%;border:0;background:var(--x-surface,#fff)}
.attimg{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:12px;overflow:auto;background:repeating-conic-gradient(var(--x-surface-2,#f4f4f5) 0 25%,var(--x-surface,#fff) 0 50%) 0 0/18px 18px}
.attimg img,.attimg video{max-width:100%;max-height:100%;object-fit:contain;cursor:zoom-in;border-radius:4px;box-shadow:0 2px 10px rgba(0,0,0,.08)}

/* ===== Tab Thiết bị (thiết kế lại) ===== */
.dvp.dvp3{height:100%;overflow:hidden;padding:12px 0;display:flex;flex-direction:column;gap:var(--ui-s3)}
/* dải tổng quan: một khối, 4 ô ngăn bằng đường kẻ */
.dvx{flex:none;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--ui-surface);border:1px solid var(--ui-border);border-radius:var(--ui-radius-lg);overflow:hidden}
.dvx-c{display:flex;flex-direction:column;justify-content:flex-start;gap:4px;min-width:0;padding:12px 16px 14px;border:0;border-left:1px solid var(--ui-border);background:none;font:inherit;color:inherit;text-align:left}
.dvx-c:first-child{border-left:0}
button.dvx-c{cursor:pointer}button.dvx-c:hover{background:var(--ui-surface-hover)}
button.dvx-c:hover .dvx-s{color:var(--ui-primary)}
.dvx-l{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ui-muted)}
.dvx-v{display:flex;align-items:baseline;gap:6px;min-width:0;white-space:nowrap}
.dvx-v b{font-size:20px;font-weight:600;line-height:1.25;font-variant-numeric:tabular-nums;color:var(--ui-text)}
.dvx-v em{font-style:normal;font-size:12px;color:var(--ui-muted);font-variant-numeric:tabular-nums}
.dvx-p{margin-left:auto;font-size:12px;color:var(--ui-text-2);font-variant-numeric:tabular-nums}
.dvx-n{display:inline-flex;align-items:center;gap:4px;margin-left:auto;font-variant-numeric:tabular-nums;font-size:12px;color:var(--ui-warning)}
.dvx-n.bad{color:var(--ui-danger)}
.dvx-s{display:flex;align-items:center;gap:12px;min-height:18px;font-size:12px;color:var(--ui-muted);font-variant-numeric:tabular-nums}
.dvx-s>span{display:inline-flex;align-items:center;gap:4px}
.dvx-s svg.i{color:var(--ui-muted)}
.dvx-c .dvx-b{width:100%;margin-top:7px}
.dvx-b{display:block;height:4px;border-radius:999px;background:var(--ui-surface-hover);overflow:hidden;flex:none}
.dvx-b i{display:block;height:100%;border-radius:999px;background:var(--ui-primary)}
.dvx-b.g i{background:var(--ui-success)}.dvx-b.w i{background:var(--ui-warning)}.dvx-b.r i{background:var(--ui-danger)}
/* bảng */
.tw.dvx-tw{flex:1;min-height:0;height:auto;overflow:auto;background:var(--ui-surface);border:1px solid var(--ui-border);border-radius:var(--ui-radius-lg)}
.dvx-tw .grid{table-layout:fixed;width:100%}
.dvx-tw .grid td{height:44px;max-width:none}
.dvx-tw .grid tbody tr:last-child td{border-bottom:0}
.dvx-tw .grid tbody tr:hover td{background:var(--ui-surface-hover)}
.dvx-tw tr[data-dev]{cursor:default}
.dvr-n{display:inline-flex;align-items:center;gap:9px;min-width:0;max-width:100%}
.dvr-n svg.i{color:var(--ui-muted);flex:none}
.dvr-n b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dvr-sn{color:var(--ui-muted)}
.dvr-sn code{font:inherit;font-size:12px;font-variant-numeric:tabular-nums;letter-spacing:.01em}

.dvx-tw tr:hover .dvr-sn .mini{opacity:.7}.dvx-tw .dvr-sn .mini:hover{opacity:1}
.dvr-o{display:inline-flex;align-items:center;gap:8px;min-width:0;max-width:100%}
.dvr-o>span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dvr-o.mut,.dvx-tw td.mut{color:var(--ui-muted)}
.dvr-o.mut svg.i{color:var(--ui-muted)}
.dvr-l{white-space:nowrap}
.dvr-l>*{vertical-align:middle}
.dvr-ln{display:inline-block;min-width:58px;font-variant-numeric:tabular-nums}
.dvr-ln b{font-weight:500}.dvr-ln b.neg{color:var(--ui-danger)}
.dvr-ln i{font-style:normal;color:var(--ui-muted);margin-left:3px}
.dvr-l .dvx-b{display:inline-block;width:64px;margin-left:6px}
.dvr-nl{font-size:12px;color:var(--ui-muted);margin-left:6px}
.dvs2{display:inline-flex;align-items:center;gap:7px;color:var(--ui-text)}
.dvs2.over{color:var(--ui-danger)}
.dvs-d{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ui-success);flex:none;font-style:normal}
.dvs-d.idle{background:var(--ui-edge)}.dvs-d.full{background:var(--ui-warning)}.dvs-d.over{background:var(--ui-danger)}
.dvr-q{white-space:nowrap;overflow:hidden;text-overflow:clip}
.dvq{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 6px;margin-right:2px;border:0;border-radius:var(--ui-radius-sm);background:none;color:var(--ui-muted);font:inherit;font-size:12px;cursor:pointer;font-variant-numeric:tabular-nums}
.dvq:hover{background:var(--ui-primary-soft);color:var(--ui-primary-dark)}
.dvq b{font-weight:500;color:var(--ui-text)}.dvq i{font-style:normal;color:var(--ui-muted)}
.dvq.z b{color:var(--ui-muted);font-weight:400}
.dvq.over,.dvq.over b,.dvq.over i{color:var(--ui-danger)}
.dvx-tw .c-act{text-align:right;padding-right:8px}
.dvx-tw .c-act .btn{opacity:0}.dvx-tw tr:hover .c-act .btn,.dvx-tw tr:focus-within .c-act .btn{opacity:1}
.dvp3 .empty{flex:1}
/* popup Loại máy / Tình trạng dùng lại khung .tpk */
.pop.tpk .colrow.cur{background:var(--ui-primary-soft)}
.pop.tpk .colrow.cur .t{color:var(--ui-primary-dark);font-weight:500}
.pop.tpk.dvk-s .tpk-ic svg.ck{color:var(--ui-muted)}
@media(max-width:1100px){.dvx{grid-template-columns:repeat(2,minmax(0,1fr))}.dvx-c:nth-child(3){border-left:0}.dvx-c:nth-child(n+3){border-top:1px solid var(--ui-border)}}

.dvx-tw .grid td.dvr-l,.dvx-tw .grid td.dvr-q{overflow:hidden;text-overflow:clip}
.dvr-l .dvx-b{width:56px}
.dvq>span{display:inline-flex;align-items:baseline}

/* ── chuẩn chữ: 13 thường · 12 phụ muted · 11 nhãn in hoa · 20 số lớn ── */
.dvp3{font-size:13px;color:var(--ui-text)}
.dvx-v b,.dvx-v{line-height:1.3}
.dvx-p{display:none}
.dvx-tw .grid td{font-size:13px}
.dvr-n b,.dvr-ln b,.dvq b{font-weight:500}
.dvr-o{font-size:13px}
.dvs2{font-size:12px;white-space:nowrap}
/* nút chọn kiểu hiển thị */
.dvvw{display:inline-flex;height:34px;padding:2px;gap:2px;border:1px solid var(--ui-border);border-radius:var(--ui-radius-sm);background:var(--ui-surface)}
.dvvw button{width:30px;height:28px;display:grid;place-items:center;border:0;border-radius:4px;background:none;color:var(--ui-muted);cursor:pointer}

/* ── lưới thẻ ── */
.dvcg{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(236px,1fr));gap:12px;align-content:start;padding:1px}
.dvc{display:flex;flex-direction:column;min-width:0;background:var(--ui-surface);border:1px solid var(--ui-border);border-radius:var(--ui-radius-lg);cursor:pointer;outline:0;transition:border-color .15s}

.dvc:focus-visible{outline:2px solid var(--ui-primary);outline-offset:1px}
.dvc-a{height:136px;display:grid;place-items:center;background:var(--ui-bg);border-bottom:1px solid var(--ui-border);border-radius:var(--ui-radius-lg) var(--ui-radius-lg) 0 0;overflow:hidden}
.dvc-a .dva{transition:transform .2s cubic-bezier(.2,.8,.2,1)}
.dvc:hover .dvc-a .dva{transform:scale(1.04)}
.dvc-b{display:flex;flex-direction:column;gap:8px;padding:12px 14px 12px}
.dvc-h{display:flex;align-items:center;gap:8px;min-width:0}
.dvc-h b{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dvc-m{display:flex;align-items:center;gap:7px;min-width:0;font-size:12px;color:var(--ui-text-2)}
.dvc-m>span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dvc-m svg.i{color:var(--ui-muted)}
.dvc-q{display:flex;align-items:center;flex-wrap:nowrap;overflow:hidden;min-height:24px;margin:0 -6px}
.dvc-q .dvq{cursor:inherit}.dvc-q .dvq:hover{background:none;color:var(--ui-muted)}
.dvc-e{font-size:12px;color:var(--ui-muted);padding:0 6px}
/* ── hình máy (CSS), kích thước theo --u ── */
.dva{--u:1px;--bz:var(--ui-edge);position:relative;display:flex;flex:none;background:var(--ui-surface);border:1.5px solid var(--bz);box-sizing:border-box}
.dva.big{--u:2.7px}
.dva.phone{width:calc(54*var(--u));height:calc(96*var(--u));border-radius:calc(12*var(--u));padding:calc(9*var(--u)) calc(4*var(--u)) calc(7*var(--u))}
.dva.phone::before{content:"";position:absolute;top:calc(3.5*var(--u));left:50%;width:calc(14*var(--u));height:calc(2.5*var(--u));margin-left:calc(-7*var(--u));border-radius:9px;background:var(--bz);opacity:.55}
.dva.pc{width:calc(108*var(--u));height:calc(68*var(--u));border-radius:calc(6*var(--u));padding:calc(4*var(--u));margin-bottom:calc(16*var(--u))}
.dva-st{position:absolute;left:50%;top:100%;width:calc(10*var(--u));height:calc(10*var(--u));margin-left:calc(-5*var(--u));background:var(--bz);opacity:.55}
.dva-st::after{content:"";position:absolute;left:50%;top:100%;width:calc(36*var(--u));height:calc(4*var(--u));margin-left:calc(-18*var(--u));border-radius:calc(2*var(--u));background:var(--bz)}
.dva.boxphone{width:calc(100*var(--u));height:calc(70*var(--u));border-radius:calc(7*var(--u));padding:calc(5*var(--u));gap:calc(5*var(--u))}
.dva-rk{display:flex;flex-direction:column;justify-content:space-between;width:calc(18*var(--u));padding:calc(2*var(--u)) 0}
.dva-rk i{display:block;height:calc(14*var(--u));border-radius:calc(2.5*var(--u));border:1px solid var(--ui-border);background:var(--ui-bg);position:relative}
.dva-rk i::after{content:"";position:absolute;right:calc(3*var(--u));top:50%;width:calc(3*var(--u));height:calc(3*var(--u));margin-top:calc(-1.5*var(--u));border-radius:50%;background:var(--ui-success)}
.dvc.idle .dva-rk i::after,.dvz-l .dva-rk i::after{background:var(--ui-edge)}
.dvc.free .dva-rk i::after{background:var(--ui-success)}
.dva-s{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(2*var(--u));border-radius:calc(5*var(--u));background:var(--ui-bg);border:1px solid var(--ui-border);overflow:hidden}
.dva.phone .dva-s{border-radius:calc(7*var(--u))}
.dva-f{position:absolute;left:0;right:0;bottom:0;background:var(--ui-primary-soft);border-top:1.5px solid var(--ui-primary-line);transition:height .3s}
.dva-f.w{background:var(--ui-warning-soft);border-top-color:var(--ui-warning)}
.dva-f.r{background:var(--ui-danger-soft);border-top-color:var(--ui-danger)}
.dva-f[style*="height:0%"]{border-top:0}
.dva-n{position:relative;display:flex;align-items:baseline;gap:calc(2*var(--u));font-variant-numeric:tabular-nums;white-space:nowrap}
.dva-n b{font-size:calc(15*var(--u));font-weight:600;color:var(--ui-text);line-height:1}
.dva-n i{font-style:normal;font-size:calc(10*var(--u));color:var(--ui-muted)}
.dva.big .dva-n b{font-size:34px}.dva.big .dva-n i{font-size:15px}
.dva-l{position:relative;font-size:12px;color:var(--ui-muted)}
/* ── phóng vào máy ── */
#dvz{position:fixed;inset:0;z-index:55}
.dvz-bg{position:absolute;inset:0;background:rgb(16 24 40/36%)}
.dvz-p{position:absolute;background:var(--ui-surface);border:1px solid var(--ui-border);border-radius:var(--ui-radius-lg);box-shadow:0 8px 28px rgb(16 24 40/10%);transform-origin:0 0;pointer-events:none}
.dvz-c{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(940px,calc(100vw - 32px));height:min(600px,calc(100vh - 48px));display:grid;grid-template-columns:300px minmax(0,1fr);border-radius:var(--ui-radius-lg);overflow:hidden}

.dvz-cn{font-variant-numeric:tabular-nums}.dvz-cn b{font-size:15px;font-weight:600}.dvz-cn i{font-style:normal;font-size:12px;color:var(--ui-muted);margin-left:4px}

/* ============ core_animation · chỉ giữ hiệu ứng ảnh hưởng trải nghiệm chính ============ */
:root{--ca-out:cubic-bezier(.22,1,.36,1);--ca-spring:cubic-bezier(.34,1.38,.64,1);--ca-in:cubic-bezier(.4,0,1,1);
 --ca-press:80ms;--ca-pop:120ms;--ca-win:200ms;--ca-exit:90ms}

/* 1) Menu / popup: mọc ra từ nút bấm (điểm gốc do JS đặt), đóng thì mờ nhanh */
@keyframes ca-pop-in{from{opacity:0;transform:scale(.95) translateY(-2px)}to{opacity:1;transform:none}}
@keyframes ca-pop-out{to{opacity:0;transform:scale(.97)}}
.pop{transform-origin:var(--ca-ox,top left);animation:ca-pop-in var(--ca-pop) var(--ca-out) backwards}
.pop.ca-out{animation:ca-pop-out var(--ca-exit) var(--ca-in) both;pointer-events:none}

/* 2) Hộp thoại / Cài đặt / panel: nền mờ dần (không blur) + cửa sổ bung từ nút (JS), dự phòng phóng nhẹ */
@keyframes ca-veil-in{from{opacity:0}to{opacity:1}}
@keyframes ca-veil-out{to{opacity:0}}
@keyframes ca-win-in{from{opacity:0;transform:scale(.95) translateY(8px)}to{opacity:1;transform:none}}
@keyframes ca-win-out{to{opacity:0;transform:scale(.97)}}
.overlay{animation:ca-veil-in var(--ca-win) ease-out backwards}
.overlay>.modal,.overlay.c .sheet{animation:ca-win-in var(--ca-win) var(--ca-out) backwards}
.overlay.ca-out{animation:ca-veil-out var(--ca-exit) ease-in both;pointer-events:none}
.overlay.ca-out>.modal,.overlay.ca-out .sheet{animation:ca-win-out var(--ca-exit) var(--ca-in) both}
.ca-fly,.overlay.ca-out>.ca-fly{animation:none!important}

/* 4) Gạch chân tab trượt giữa các tab */
.tabs.ca{position:relative}
.tabs.ca .tab.on::after{display:none}
.tabs .ca-ind{position:absolute;left:0;bottom:0;height:2px;border-radius:2px 2px 0 0;background:var(--ui-primary,#2563eb);transform-origin:0 50%;pointer-events:none}

/* 5) Tin nhắn chat (Cú vọ): bong bóng hiện kiểu iMessage — mọc ra từ góc phía người gửi, nảy nhẹ rồi dừng mềm.
      Chỉ tin mới (class ca-new do khung chat gắn), tin cũ khi vẽ lại không chạy lại hiệu ứng. */

.ai-u.ca-new{transform-origin:100% 100%;animation:ca-msg-me 340ms cubic-bezier(.34,1.38,.64,1) backwards}
.ai-m.ca-new{transform-origin:0 100%;animation:ca-msg-bot 380ms cubic-bezier(.22,1,.36,1) 40ms backwards}

/* 6) Cú vọ đang học câu vừa 👍: icon cú ở đầu khung nháy sáng; tin đó mờ / hiện như đang được nạp vào */

 const v=b.data[o.take];return v==null?'':String(v)}
function lookupSecret(f){const o=lookupCfg(f);return I.field[o.take]?.type==='secret'}

function getView(){
 const so=S.sort[S.tab],mk=[S.tab,S.dept,S.owner,S.sub,S.q,[...S.st],[...S.tf],S.devf,so?so.k+':'+so.d+':'+(so.ord||[]).join('\u0001'):'',JSON.stringify(S.fl[S.tab]||[]),S.accs.length,S.idf&&S.idf.tab===S.tab?S.idf.k:''].join('|');

 if(S.tab==='all'){if(S.tf.size)rows=rows.filter(a=>S.tf.has(a.tab_id))}else if(S.st.size)rows=rows.filter(a=>S.st.has(a.status_id));
 const pq=parseQ(S.q),cd=condsOf();if(pq.length||cd.length)rows=rows.filter(a=>matchQ(a,pq)&&cd.every(c=>matchCond(a,c)));
 rows.ordered=ordered;
 if(so){const key=a=>so.k==='status'?(stOf(a)?.label||''):so.k==='updated'?a.updated:so.k==='note'?RTE.text(a.note):so.k==='links'?(I.inn[a.id]||[]).length:so.k==='outl'?outCount(a):so.k==='owner'?(I.own[a.owner_id]?.name||''):so.k==='dept'?(I.dpt[a.dept_id]?.name||''):so.k==='device'?(I.dev[a.device_id]?.name||''):so.k==='label'?a.label:so.k==='tab'?(I.tab[a.tab_id]?.name||''):I.field[so.k]?.type==='link'?(I.out[a.id]?.[so.k]||[]).map(i=>I.acc[i]?.label).join(','):attStr(a.data[so.k]);
  const ks=new Map(rows.map(a=>[a.id,key(a)]));
  const rk=so.ord?new Map(rows.map(a=>{const vs=colVals(a,so.k);let r=so.ord.length;(vs.length?vs:[EMP]).forEach(v=>{const i=so.ord.indexOf(v);if(i>=0&&i<r)r=i});return [a.id,r]})):null;
  rows=[...rows].sort((x,y)=>{if(rk){const d=rk.get(x.id)-rk.get(y.id);if(d)return d}const a=ks.get(x.id),b=ks.get(y.id);return (typeof a==='number'?a-b:COLL.compare(String(a),String(b)))*so.d})}
 else if(!rows.ordered)rows=[...rows].sort((x,y)=>((y.created||0)-(x.created||0))||(y.id-x.id));
 VMEMO.k=mk;VMEMO.rows=rows;return rows}

function matchTok(raw,t){const k=nz(raw),r=String(raw).trim();if(!k&&!(r==='_'||r==='-'))return null;
 if(r==='_'||r==='-')return 'skip';
 const grp=ALIAS.find(g=>g.includes(k)||g.includes(r.toLowerCase()));
 const fs=t.fields;let f=fs.find(f=>nz(f.label)===k);
 if(f)return f.id;
 if(grp){if(grp[0]==='note')return 'note';if(grp[0]==='status')return 'status';if(grp[0]==='owner')return 'owner';if(grp[0]==='device')return 'device';if(grp[0]==='skip')return 'skip';
  f=fs.find(f=>grp.includes(nz(f.label)))||fs.find(f=>grp.some(g=>nz(f.label).includes(g)&&g.length>2));if(f)return f.id}
 f=fs.find(f=>nz(f.label).startsWith(k)&&k.length>=2);return f?f.id:null}

function pickLinks(anchor,f,cur,done,deptId,ownerId){
 const tt=I.tab[f.link_tab];if(!tt){toast('Trường chưa gắn tab liên kết','err');return}
 const pick=new Set(cur),all=S.accs.filter(x=>x.tab_id==tt.id);let qq='';
 const p=openPop(anchor,`<div class="picker"><div class="psearch">${ico('search',14)}<input class="in" placeholder="Tìm hoặc tạo mới"></div><div class="plist"></div><div class="pfoot"><button class="btn sm pri" data-pk="ok">${ico('check',14)}</button></div></div>`);
 const inp=$('input',p),list=$('.plist',p);
 const draw=()=>{const s=qq.trim().toLowerCase();let rows=all.filter(x=>!s||x.label.toLowerCase().includes(s));
  rows.sort((a,b)=>(pick.has(b.id)-pick.has(a.id))||((b.dept_id==deptId)-(a.dept_id==deptId))||b.id-a.id);rows=rows.slice(0,60);
  list.innerHTML=rows.map(x=>{const st=I.status[x.status_id];return `<button class="mi" data-id="${x.id}"><span class="chk ${pick.has(x.id)?'on':''}">${pick.has(x.id)?ico('check',12):''}</span><i class="dot" style="background:${st?.color||GREY}"></i><span class="t">${esc(x.label)}</span></button>`}).join('')
   +(s&&!all.some(x=>x.label.toLowerCase()===s)?`<button class="mi" data-new="1">${ico('plus',14)}<span class="t">${esc(qq.trim())}</span><em>${esc(tt.name)}</em></button>`:'')||`<div class="ph pad">${ico('inbox',20)}</div>`};
 inp.oninput=()=>{qq=inp.value;draw()};
 p.onclick=async e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.id){const id=+b.dataset.id;pick.has(id)?pick.delete(id):pick.add(id);draw()}
  else if(b.dataset.new){const r=await api('quick',{tab_id:tt.id,dept_id:deptId,owner_id:ownerId??null,text:qq.trim()});await load();pick.add(r.id);all.push(I.acc[r.id]);qq='';inp.value='';draw()}
  else if(b.dataset.pk)closePop()};
 p._close=()=>{if(pick.size!==cur.length||cur.some(x=>!pick.has(x)))done([...pick])};
 draw();inp.focus()}

  +`</header><div class="tvb">${ed?`<textarea class="tvta" spellcheck="false">${esc(v)}</textarea>`:`<div class="tvt ${v?'':'mut'}" tabindex="0">${v?(sh?esc(v):'••••••••'):'(trống)'}</div>`}</div>`

 const close=async()=>{if(ed&&$('.tvta',el).value!==o.val&&!(await confirmBox('Bỏ thay đổi chưa lưu?','Bỏ','x','danger')))return;el.remove();ro.disconnect();document.removeEventListener('keydown',kd,true)};

 el.addEventListener('pointerdown',e=>{const h=e.target.closest('.tvh');if(!h||e.target.closest('button')||e.button!==0)return;e.preventDefault();

function inlineInput(td,val,type,commit){const old=td.innerHTML;td.classList.add('editing');td.innerHTML=`<input class="in-inline" type="${type}" value="${esc(val)}">`;const inp=td.firstChild;inp.focus();try{inp.select()}catch(e){}let done=false;

function reportData(){
 const A=scoped(),now=Date.now()/1000,hc=rpE(),tH={},dH={},oH={};
 A.forEach(a=>{const h=rpH(a);hc[h]++;(tH[a.tab_id]??=rpE())[h]++;(dH[a.dept_id]??=rpE())[h]++;if(a.owner_id)(oH[a.owner_id]??=rpE())[h]++});
 const T=A.length,new7=A.filter(a=>a.created>now-7*86400).length,up24=A.filter(a=>a.updated>now-86400).length;
 const risk=[];S.links.forEach(l=>{const s=I.acc[l.src],d=I.acc[l.dst];if(s&&d&&inScope(s)&&rpH(s)==='g'&&rpH(d)==='b')risk.push([s.id,d.id])});
 const shared=A.filter(a=>(I.inn[a.id]||[]).length>=5).sort((a,b)=>I.inn[b.id].length-I.inn[a.id].length);
 const lt=new Set();S.meta.tabs.forEach(t=>t.fields.forEach(f=>{if(f.type==='link'){lt.add(t.id);lt.add(f.link_tab)}}));
 const orphan=A.filter(a=>lt.has(a.tab_id)&&!outCount(a)&&!(I.inn[a.id]||[]).length),noown=A.filter(a=>!a.owner_id),stale=A.filter(a=>a.updated<now-7*86400);
 const issues=[
  {k:'risk',lv:'b',ic:'alert',t:'Đang hoạt động nhưng phụ thuộc dòng lỗi',d:'Dòng live đang liên kết tới dòng die — dễ bị ảnh hưởng theo.',ids:[...new Set(risk.map(r=>r[0]))],pairs:risk},
  {k:'shared',lv:'w',ic:'users',t:'Một tài nguyên bị dùng chung quá nhiều',d:'Từ 5 dòng trở lên dùng chung một tài nguyên — hỏng một cái là ảnh hưởng hàng loạt.',ids:shared.map(a=>a.id)},
  {k:'orphan',lv:'w',ic:'link',t:'Chưa có liên kết nào',d:'Dòng thuộc tab có liên kết nhưng chưa nối với dòng nào.',ids:orphan.map(a=>a.id)},
  {k:'stale',lv:'w',ic:'clock',t:'Quá 7 ngày chưa cập nhật',d:'Dữ liệu có thể đã cũ — nên kiểm tra lại trạng thái.',ids:stale.map(a=>a.id)},
  {k:'noown',lv:'w',ic:'user',t:'Chưa có owner',d:'Không rõ ai chịu trách nhiệm dòng này.',ids:noown.map(a=>a.id)}];
 const byTab=S.meta.tabs.map(t=>{const h=tH[t.id]||rpE();return{key:'t'+t.id,name:t.name,ic:t.icon,c:t.color,h,n:h.g+h.w+h.b+h.n,attr:`data-a="tab" data-id="${t.id}"`}});
 const byDept=S.meta.depts.map(d=>{const h=dH[d.id]||rpE();return{key:'d'+d.id,name:d.name,c:d.color,dot:1,h,n:h.g+h.w+h.b+h.n,attr:`data-a="rscope" data-d="${d.id}"`,on:S.dept==d.id&&S.owner==null}});
 const memo={},sub=id=>memo[id]||(memo[id]=(()=>{const h={...(oH[id]||rpE())};(I.kids[id]||[]).forEach(k=>{const x=sub(k);['g','w','b','n'].forEach(q=>h[q]+=x[q])});return h})());
 const byOwner=[];(S.dept==='all'?S.meta.depts:[deptOf(S.dept)]).forEach(dd=>treeOrder(dd.id).forEach(({o,d})=>{if(S.owner!=null&&!I.scO.has(o.id))return;
  const h=sub(o.id),own=oH[o.id]||rpE(),n=h.g+h.w+h.b+h.n;byOwner.push({key:'o'+o.id,name:o.name,lv:d,o,dept:dd.name,h,n,direct:own.g+own.w+own.b+own.n,attr:`data-a="rscope" data-d="${dd.id}" data-o="${o.id}"`,on:S.owner==o.id})}));
 const days=14,b0=new Date();b0.setHours(0,0,0,0);const t0=b0.getTime()/1000-(days-1)*86400,cr=Array(days).fill(0),up=Array(days).fill(0);
 A.forEach(a=>{const c=Math.floor((a.created-t0)/86400),u=Math.floor((a.updated-t0)/86400);if(c>=0&&c<days)cr[c]++;if(u>=0&&u<days)up[u]++});
 const recent=[...A].sort((a,b)=>b.updated-a.updated).slice(0,8);
 return{A,T,hc,new7,up24,issues,issueN:issues.reduce((n,x)=>n+x.ids.length,0),byTab,byDept,byOwner,cr,up,t0,recent}}

function rpDonut(hc,T){const R=62,C=2*Math.PI*R;let off=0;
 const segs=T?['g','w','b','n'].filter(k=>hc[k]).map(k=>{const len=hc[k]/T*C,s=`<circle r="${R}" cx="80" cy="80" fill="none" stroke="${HC[k]}" stroke-width="18" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 80 80)"><title>${RPL[k]}: ${hc[k]}</title></circle>`;off+=len;return s}).join(''):'';
 return `<svg viewBox="0 0 160 160" class="rp-donut" role="img" aria-label="Tỉ lệ hoạt động ${rpPct(hc.g,T)}%"><circle r="${R}" cx="80" cy="80" fill="none" stroke="var(--ui-border)" stroke-width="18"/>${segs}<text x="80" y="82" text-anchor="middle" class="rp-dn">${T?rpPct(hc.g,T)+'%':'—'}</text><text x="80" y="100" text-anchor="middle" class="rp-dl">hoạt động</text></svg>`}

function rpChart(cr,up,t0){
 const days=cr.length,W=640,H=190,mx=Math.max(1,...cr,...up),L=Math.max(30,String(mx).length*7+12),X=i=>L+(W-L-8)*i/(days-1),Y=v=>H-(H-10)*v/mx;
 const path=a=>a.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join(' ');
 const grid=[0,.5,1].map(f=>{const y=Y(mx*f).toFixed(1);return `<line x1="${L}" x2="${W-8}" y1="${y}" y2="${y}" class="rp-gl"/><text x="${L-6}" y="${(+y+3).toFixed(1)}" text-anchor="end" class="rp-gt">${Math.round(mx*f)}</text>`}).join('');
 const xl=cr.map((_,i)=>{if(i%2)return '';const d=new Date((t0+i*86400)*1000);return `<text x="${X(i).toFixed(1)}" y="${H+16}" text-anchor="middle" class="rp-gt">${d.getDate()}/${d.getMonth()+1}</text>`}).join('');
 const dots=(a,c,l)=>a.map((v,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="3.2" class="${c}"><title>${new Date((t0+i*86400)*1000).toLocaleDateString('vi-VN')} · ${l}: ${v}</title></circle>`).join('');
 return `<svg viewBox="0 0 ${W} ${H+24}" class="rp-chart" role="img" aria-label="Hoạt động 14 ngày">${grid}${xl}
  <path d="${path(cr)} L${X(days-1).toFixed(1)} ${H} L${X(0).toFixed(1)} ${H} Z" class="rp-ar1"/><path d="${path(cr)}" class="rp-ln1"/><path d="${path(up)}" class="rp-ln2"/>${dots(up,'rp-dt2','Cập nhật')}${dots(cr,'rp-dt1','Tạo mới')}</svg>`}

  <div class="rp-c"><h3>Cần xử lý<span class="sp"></span><em>${D.issueN?'bấm để mở danh sách':'không có vấn đề'}</em></h3><div class="rp-isl">${issues}</div></div>

/* ===== Popup chọn dùng chung: Tab · Loại máy · Tình trạng =====
   pickPop(anchor,{cls,title,all,items:()=>[{id,label,n,ic,tint,dot}],get:()=>Set đang chọn,set:Set=>void})
   Một khung duy nhất: tiêu đề + đếm, dòng "Tất cả", danh sách ô tích. */
function pickPop(anchor,o){
 const box=(on,part)=>`<span class="chk ${on?'on':part?'part':''}">${on?ico('check',12):part?'<b class="bar"></b>':''}</span>`,
  mark=x=>x.dot?`<span class="tpk-ic"><i class="dvs-d ${x.dot}"></i></span>`:x.ic?`<span class="tpk-ic" ${x.tint||''}>${ico(x.ic,15)}</span>`:'',
  row=(id,on,part,x,cls='')=>`<button class="colrow ${cls} ${on?'':'off'}" data-pk="${id}" role="menuitemcheckbox" aria-checked="${on}">${box(on,part)}${mark(x)}<span class="t">${esc(x.label)}</span><em class="r">${x.n??''}</em></button>`,
  html=()=>{const L=o.items(),G=o.get(),k=L.filter(x=>G.has(x.id)).length,all=k===L.length;
   return `<div class="tpk-h"><span>${esc(o.title)}</span><em>${k}/${L.length}</em></div>`
    +row('*',all,k>0,{label:o.all,n:L.reduce((t,x)=>t+(x.n||0),0)},'tpk-all')+'<div class="sep"></div>'
    +`<div class="tpk-l">${L.map(x=>row(x.id,G.has(x.id),0,x)).join('')}</div>`};
 const p=openPop(anchor,html(),'tpk '+(o.cls||''));p._cls=o.cls;p._key=pickKey(anchor);
 p.addEventListener('click',e=>{const b=e.target.closest('[data-pk]');if(!b)return;e.stopPropagation();
  const L=o.items().map(x=>x.id),G=o.get(),k=b.dataset.pk,id=L.find(x=>String(x)===k);
  let N;
  if(k==='*')N=new Set(G.size===L.length?[]:L);
  else{N=new Set(G);N.has(id)?N.delete(id):N.add(id)}
  o.set(N);if(p.isConnected)p.innerHTML=html()});
 return p}
/* nút mở popup chọn (đồng bộ mọi nơi) + bật/tắt */
const pickOpen=cls=>!!(POP&&POP.classList.contains(cls));
const pickKey=el=>el&&el.dataset?(el.dataset.a||el.dataset.g||''):'';
/* bấm lại đúng nút đang mở → đóng (mousedown ngoài popup đóng trước, click sau không mở lại) */
let PICKJUST=null;
window.addEventListener('mousedown',e=>{PICKJUST=null;const b=e.target.closest&&e.target.closest('[data-a],[data-g]');if(POP&&POP._key&&b&&pickKey(b)===POP._key)PICKJUST=POP._cls;
 if(POP&&POP._key&&!POP.contains(e.target))$$('.cvt.on').forEach(x=>x.classList.remove('on'))},true);
function pickBtn(a,cls,ic,label,val,act,title){return `<button class="btn outline cvt ${pickOpen(cls)?'on':''} ${act?'act':''}" data-a="${a}" aria-haspopup="true" title="${esc(title)}">${ico(ic,15)}<span>${esc(label)}</span><em class="gcnt">${esc(val)}</em>${ico('chevd',14,'cv')}</button>`}
function pickToggle(cls,open){if(PICKJUST===cls){PICKJUST=null;return null}if(pickOpen(cls)){closePop();return null}return open()}
const pickVal=(G,L,name)=>G.size===L.length?'Tất cả':G.size===1?name([...G][0]):G.size+'/'+L.length;

function isDateKey(k){if(k==='updated'||k==='created')return true;const f=I.field[k];if(!f)return false;if(f.type==='date')return true;if(f.type!=='text')return false;
 let n=0,ok=0;for(const a of S.accs){if(a.tab_id!=f.tab_id)continue;const v=a.data[f.id];if(v==null||v==='')continue;n++;if(DP.parse(v))ok++;if(n>=200)break}return n>=3&&ok/n>=.9}
let RG=null;
function rgPresets(lo,hi){const t=DP.today(),tn=DP.num(t),d=new Date(),y=d.getFullYear(),mo=d.getMonth(),q=Math.floor(mo/3)*3;
 const P2=n=>String(n).padStart(2,'0'),last=(Y,M)=>new Date(Y,M+1,0).getDate(),pm=mo?mo-1:11,py=mo?y:y-1;

function rgCount(a,b){let n=0;RG.days.forEach((c,d)=>{if(d>=a&&d<=b)n+=c});return n}
function rangeHtml(){const k=FP.k,m=facet(k),days=new Map();let emp=0;
 for(const [v,n] of m){if(v===EMP){emp+=n;continue}const d=DP.parse(v);if(d)days.set(d,(days.get(d)||0)+n)}
 const ks=[...days.keys()].sort();if(!ks.length){RG=null;return `<div class="empty-s">${ico('calendar',18)}<span>Chưa có dữ liệu ngày</span></div>`}
 const lo=ks[0],hi=ks[ks.length-1],cur=condsOf().find(c=>c.k==k&&c.op==='range');
 let a=cur?.v[0]||lo,b=cur?.v[1]||hi;if(a<lo)a=lo;if(b>hi)b=hi;if(a>b)a=b;
 const D=DP.num(hi)-DP.num(lo)+1;RG={k,lo,hi,days,a,b,emp,D,sl:null};
 return `<div class="drg">

  ${D===1?`<div class="rg-one">${ico('calendar',14)}<span>Toàn bộ dữ liệu nằm trong ngày ${DP.fmt(lo)}</span></div>`:`<div class="rg-box" data-rgs></div>`}
  <div class="rg-in"><label class="rg-f"><span>Từ</span><button type="button" class="dpb" data-a="rgcal" data-s="0" aria-haspopup="dialog">${ico('calendar',14)}<span data-rgv="a">${DP.fmt(a)}</span></button></label><span class="rg-ar">${ico('chevr',14)}</span><label class="rg-f"><span>Đến</span><button type="button" class="dpb" data-a="rgcal" data-s="1" aria-haspopup="dialog">${ico('calendar',14)}<span data-rgv="b">${DP.fmt(b)}</span></button></label></div>
  <div class="rg-info"><b data-rgn>${rgCount(a,b).toLocaleString('vi')}</b><span>dòng trong khoảng</span>${emp?`<span class="mut">· ${emp.toLocaleString('vi')} dòng trống không tính</span>`:''}</div></div>`}
function rgMount(){if(!RG||!POP)return;const h=$('[data-rgs]',POP);if(h&&!h._m){h._m=1;
  RG.sl=DP.slider(h,{lo:RG.lo,hi:RG.hi,a:RG.a,b:RG.b,days:RG.days,onInput:(A,B)=>{RG.a=A;RG.b=B;rgPaint();rgApply()},onChange:(A,B)=>{RG.a=A;RG.b=B;rgPaint();rgApply(true)}})}
 rgPaint()}
function rgPaint(){if(!RG||!POP)return;const n=$('[data-rgn]',POP);if(n)n.textContent=rgCount(RG.a,RG.b).toLocaleString('vi');
 const va=$('[data-rgv=a]',POP),vb=$('[data-rgv=b]',POP);if(va)va.textContent=DP.fmt(RG.a);if(vb)vb.textContent=DP.fmt(RG.b);
 const full=RG.a<=RG.lo&&RG.b>=RG.hi,cs=$$('[data-a=frp]',POP),hit=full?cs.length-1:cs.findIndex(c=>c.dataset.x===RG.a&&c.dataset.y===RG.b);cs.forEach((c,i)=>c.classList.toggle('on',i===hit))}
let rgT=0;function rgApply(now){clearTimeout(rgT);const go=()=>{if(!RG)return;if(RG.apply){RG.apply(RG.a,RG.b);return}setCond(RG.k,RG.a<=RG.lo&&RG.b>=RG.hi?null:{op:'range',v:[RG.a,RG.b]});refreshView();const fk=$(`.fk[data-k="${RG.k}"]`,POP);if(fk){const on=condsOf().some(c=>c.k==RG.k),d=$('i.dot',fk);if(on&&!d)fk.insertAdjacentHTML('beforeend','<i class="dot"></i>');if(!on&&d)d.remove()}};now?go():rgT=setTimeout(go,120)}
Object.assign(ACT,{
 frp(el){if(!RG)return;RG.a=el.dataset.x;RG.b=el.dataset.y;RG.sl&&RG.sl.set(RG.a,RG.b);rgPaint();rgApply(true)},

/* ===== Hộp xem ô (nhấp đúp / chuột phải › Ghi chú): Ghi chú có thanh định dạng (RTE) ===== */
function openTV(o){$('#tvbox')?.remove();closePop();
 /* Một chế độ duy nhất: mở ra là sửa được ngay (trường cho sửa) · Lưu = lưu + đóng · Esc/X = đóng (hỏi nếu còn thay đổi).
    Chỉ đọc (liên kết giá trị) và mật khẩu đang che vẫn ở chế độ xem. */
 const z=S.tvs||{w:560,h:360},W=Math.min(z.w,innerWidth-24),H=Math.min(z.h,innerHeight-24);
 const el=document.createElement('div');el.id='tvbox';el.className='tvbox'+(o.rich?' rich':'');el.setAttribute('role','dialog');el.setAttribute('aria-label',o.title);
 el.style.cssText=`width:${W}px;height:${H}px;left:${Math.max(12,(innerWidth-W)/2)}px;top:${Math.max(12,(innerHeight-H)/2)}px`;
 let sh=!o.secret||S.reveal,ed=!!o.save&&sh,RE=null,cur=o.val,busy=false;
 const txt=v=>o.rich?RTE.text(v):String(v??'');
 const cnt=v=>{const t=txt(v);return `${t?t.split('\n').length:0} dòng · ${t.length} ký tự`};
 const live=()=>ed?(RE?RE.get():($('.tvta',el)?.value??cur)):o.val;
 const nrm=v=>RTE.isRich(v)?RTE.clean(v):String(v??'').replace(/\r\n?/g,'\n').replace(/\u00a0/g,' ').replace(/[ \t]+$/gm,'').replace(/\n+$/,'');
 const dirty=()=>ed&&nrm(live())!==nrm(o.val);
 const mark=()=>{const d=dirty(),b=$('[data-tv=save]',el);if(b)b.disabled=!d;el.classList.toggle('dirty',d);const c=$('.tvc',el);if(c)c.textContent=cnt(live())};
 const draw=()=>{const v=o.val;
  el.innerHTML=`<header class="tvh">${ico(o.icon,15)}<b>${esc(o.title)}</b>${o.sub?`<span class="mut">${esc(o.sub)}</span>`:''}<i class="tvdot" title="Có thay đổi chưa lưu"></i><div class="grow"></div>`
   +`${o.secret?`<button class="btn icon sm ghost" data-tv="eye" title="${sh?'Ẩn':'Hiện'}">${ico(sh?'eyeoff':'eye',15)}</button>`:''}${v?`<button class="btn icon sm ghost" data-tv="copy" title="Chép">${ico('copy',15)}</button>`:''}`
   +`${ed?`<button class="btn sm pri" data-tv="save" title="Lưu & đóng (Ctrl+Enter)" disabled>${ico('check',14)}<span>Lưu</span></button>`:''}<button class="btn icon sm ghost" data-tv="close" title="Đóng (Esc)">${ico('x',15)}</button>`
   +`</header><div class="tvb">${ed?(o.rich?`<div class="tvrte"></div>`:`<textarea class="tvta" spellcheck="false">${esc(v)}</textarea>`):`<div class="tvt ${v?'':'mut'} ${o.rich&&v?'rt':''}" tabindex="0">${v?(sh?(o.rich?RTE.view(v):esc(v)):'••••••••'):'(trống)'}</div>`}</div>`
   +`<footer class="tvf"><span class="tvc">${cnt(v)}</span>${tvTimes(o)}</footer>`;
  RE=null;
  if(ed&&o.rich){cur=v;RTE.mount($('.tvrte',el),v,{autofocus:true,placeholder:'Nhập nội dung…',onChange:x=>{cur=x;mark()}}).then(a=>{RE=a;mark()})}
  else if(ed){const ta=$('.tvta',el);ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length);ta.oninput=mark}};
 const shut=()=>{el.remove();ro.disconnect();document.removeEventListener('keydown',kd,true)};
 const close=async()=>{if(dirty()&&!(await confirmBox('Bỏ thay đổi chưa lưu?','Bỏ','x','danger')))return;shut()};
 const save=async()=>{if(busy)return;if(!dirty()){shut();return}let v=live();if(!o.multi&&!o.rich)v=v.replace(/\r?\n/g,' ');busy=true;
  try{await o.save(v);o.val=v;shut()}catch(e){busy=false}};
 const kd=e=>{if(!el.isConnected)return;
  if(e.key==='Escape'){const m=el.querySelector('.rte-m');e.preventDefault();e.stopImmediatePropagation();if(m){m.remove();return}close()}
  else if(ed&&(e.ctrlKey||e.metaKey)&&(e.key==='Enter'||e.key.toLowerCase()==='s')){e.preventDefault();save()}};
 document.addEventListener('keydown',kd,true);
 el.addEventListener('click',e=>{const b=e.target.closest('[data-tv]');if(!b)return;const k=b.dataset.tv;
  if(k==='close')close();else if(k==='copy')copyText(txt(live()));else if(k==='save')save();

 el.addEventListener('pointerdown',e=>{const h=e.target.closest('.tvh');if(!h||e.target.closest('button')||e.button!==0)return;e.preventDefault();

  addEventListener('pointermove',mv);addEventListener('pointerup',()=>removeEventListener('pointermove',mv),{once:true})});

/* ===== Ghi chú: hiển thị text thuần ở bảng / tìm kiếm / xuất; form Thêm/Sửa dùng thanh định dạng ===== */
function noteCell(a){if(!a.note)return `<span class="ph">${ico('note',14)}</span>`;const ls=RTE.text(a.note).split('\n');return `${RTE.isRich(fmtOf(a,'note'))?`<span class="rtm" title="Có định dạng">${ico('type',11)}</span>`:''}<span class="nt">${esc(ls[0])}</span>${ls.length>1?`<em class="nl">+${ls.length-1}</em>`:''}`}

/* ===== Định dạng hiển thị TÁCH RIÊNG khỏi dữ liệu: giá trị luôn là text thuần (chép / xuất / tìm / nhập hàng loạt không đổi),
   định dạng lưu ở data._fmt[khóa] và chỉ dùng khi text của nó còn khớp giá trị hiện tại (sửa ở nơi khác → tự bỏ định dạng cũ) ===== */
function fmtOf(a,k){const plain=k==='note'?(a.note||''):String(a.data[k]??'');if(RTE.isRich(plain))return plain;const f=a.data&&a.data._fmt&&a.data._fmt[k];return f&&RTE.text(f)===plain?f:plain}
function fmtData(a,k,v){const plain=RTE.text(v),m={...((a.data&&a.data._fmt)||{})};if(RTE.isRich(v))m[k]=v;else delete m[k];return{plain,fmt:Object.keys(m).length?m:undefined}}
function cellTV(a,k){const t=I.tab[a.tab_id];
 if(k==='note')return openTV({icon:'note',title:'Ghi chú',rich:true,multi:true,acc:a,sub:a.label,val:fmtOf(a,'note'),save:v=>{const r=fmtData(a,'note',v);return saveAcc(a,{note:r.plain,data:{_fmt:r.fmt}})}});
 const f=k==='label'?t.fields[0]:I.field[k];

 const fmtT=ts=>ts?new Date(ts*1000).toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'}):'—';
 const k=(l,v,cls='',sub='')=>`<div class="cykp ${cls}"><span class="cyl">${l}</span><b>${v}</b>${sub}</div>`;
 const cov=s.total?Math.min(100,Math.round(s.today/s.total*100)):0;
 const prog=run?(()=>{const tot=j.total||0,pct2=tot?Math.round(j.done/tot*100):0,rate=cyvRate(c),fin=tot&&j.done>=tot,
   ph=j.phase?`<span class="cyph"><i class="spin1"></i>${esc(j.phase)}</span>`:fin?`<span class="cyph"><i class="spin1"></i>Đang hoàn tất…</span>`:'';
  if(!tot)return `<div class="cypb ind"><i></i></div><div class="cypt">${ph||'<span class="cyph"><i class="spin1"></i>Đang chuẩn bị…</span>'}</div>`;
  return `<div class="cypb"><i style="width:${pct2}%"></i></div><div class="cypt"><b>${j.done.toLocaleString('vi')} / ${tot.toLocaleString('vi')}</b><span>${pct2}%</span>${!fin&&rate?`<span class="mut">${Math.round(rate*60).toLocaleString('vi')} dòng/phút</span><span class="mut">còn ~${cyvDur((tot-j.done)/rate)}</span>`:''}${ph}</div>`})():'';
 const pe=$('#cyp',el);if(pe){pe.hidden=!run;cyvSetH(pe,prog)}
 cyvSetH($('#cyk',el),k('Đã check hôm nay',`${s.today.toLocaleString('vi')}<i> / ${s.total.toLocaleString('vi')}</i>`,'wide',`<div class="cybar"><i style="width:${cov}%"></i></div>`)
  +k('Live',s.live.toLocaleString('vi'),'ok')+k('Die',s.die.toLocaleString('vi'),'bad')+(c.info.results||[]).map(([rk,rl])=>k(esc(rl),(s[rk]||0).toLocaleString('vi'),'ex')).join('')+k('Lỗi',s.error.toLocaleString('vi'),'warn')
  +k('Lần chạy cuối',fmtT(c.cfg.last))+k('Lần tới',c.cfg.auto?fmtT(c.next):'Tắt',c.cfg.auto?'':'off'));
 cyvSetH($('#cyvact',el),run?(j.opt?`<button class="btn pri" disabled><i class="spin1"></i><span>${esc(j.phase||'Đang chuẩn bị…')}</span></button>`:`<button class="btn danger" data-a="cyvstop">${ico('x',16)}<span>Dừng</span></button>`):`<button class="btn pri" data-a="cyvrun" title="Lưu cấu hình và chạy ngay">${ico('zap',16)}<span>Chạy ngay</span></button>`);
 const cr=$('#cycr',el);if(cr)cr.innerHTML=c.meta&&c.meta.credit!=null?`Còn <b>${Number(c.meta.credit).toLocaleString('vi')}</b> lượt`:'';
 const er=$('#cyerr',el);if(er){er.hidden=!j.err_msg;cyvSetH(er,j.err_msg?`${ico('alert',14)}<span>${esc(j.err_msg)}</span>`:'')}
 const R=j.recent||[];$('#cyrs',el).textContent=R.length?`${R.length} dòng mới nhất${run?'':' · lần chạy trước'}`:'';
 cyvSetH($('#cyrl',el),R.length?R.map(r=>{const a=I.acc[r.id];return `<div class="cyrr"><span class="cyst ${r.res}">${r.res==='live'?'Live':r.res==='die'?'Die':r.res==='error'?'Lỗi':esc(((c.info.results||[]).find(x=>x[0]===r.res)||[,r.res])[1])}</span><b>${esc(r.v)}</b><span class="mut">${esc(a?.label!==r.v?a?.label||'':'')}</span><div class="grow"></div><em>${esc(r.info)}</em><em>${r.ms}ms</em></div>`}).join(''):`<div class="ph pad">${ico('inbox',18)}<span>Chưa có lần chạy nào trong phiên này</span></div>`)}
function cyvRead(){const el=$('#cyv');if(!el)return;const d=CYV.draft;
 $$('[data-cf]',el).forEach(x=>{const k=x.dataset.cf;let v=x.value;if(['tab_id','field_id','threads','every'].includes(k))v=v===''?null:+v;else if(k==='timeout')v=+v;else if(k==='target')v=v==='status'?'status':+v;
  else if(k==='live'||k==='die'||(cyvC()?.info.results||[]).some(r=>r[0]===k))v=v===''?null:(d.target==='status'?+v:v);
  else if(k.startsWith('xf_'))v=v===''||v==='auto'?v:+v;else if(k.startsWith('pf_'))v=v===''?'':+v;d[k]=v});
 d.x=d.x||{};$$('[data-cfx]',el).forEach(x=>{d.x[x.dataset.cfx]=x.value.trim()})}
async function cyvSave(quiet,noLoad){cyvRead();try{await api('cyv/cfg',{id:CYV.open,cfg:CYV.draft});if(quiet!==false&&quiet)toast('Đã lưu')}catch(e){}if(!noLoad)await cyvLoad()}
Object.assign(ACT,{cyvauto(el){CYV.draft.auto=!CYV.draft.auto;el.classList.toggle('on',CYV.draft.auto)}});
document.addEventListener('change',e=>{const x=e.target;if(!x.dataset||x.dataset.cf===undefined||!CYV.open||!$('#cyv'))return;const k=x.dataset.cf;cyvRead();
 if(k==='tab_id'){const t=I.tab[CYV.draft.tab_id];CYV.draft.field_id=t?.fields[0]?.id??null;CYV.draft.target='status';CYV.draft.live=CYV.draft.die=null}
 if(k==='target'){CYV.draft.live=CYV.draft.die=null}
 if(['tab_id','target'].includes(k)){const m=$('#modal .modal');m._full=true;cyvDraw()}});
const _cyvClose=closeModal;closeModal=function(){CYV.open=null;return _cyvClose.apply(this,arguments)};

function dvInfo(d){const x=devState(d),t=x.t,k=x.k,left=t.cap?Math.max(0,t.cap-t.used):0;
 return{d,t,k,pc:t.cap?Math.min(100,t.used/t.cap*100):0,lab:k==='free'&&t.cap?'Còn '+left+' chỗ':DSL[k][0],
  tabs:S.meta.tabs.filter(tt=>(t.u[tt.id]||0)||(+d.caps[tt.id]||0)).map(tt=>{const n=t.u[tt.id]||0,c=+d.caps[tt.id]||0;return{tt,n,c,over:!!(c&&n>c)}})}}
const dvBarH=(p,cls='')=>`<span class="dvx-b ${cls}"><i style="width:${Math.max(0,Math.min(100,p))}%"></i></span>`;
const dvTone=x=>x.t.over||x.k==='full'?'r':'';
const dvStat=x=>`<span class="dvs2 ${x.k}"><i class="dvs-d ${x.k}"></i>${x.lab}</span>`;
/* hình máy vẽ bằng CSS: màn hình hiển thị tải */
