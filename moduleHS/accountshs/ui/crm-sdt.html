  const {meta:m}=await get('meta');
  const tab=m.tabs.find(t=>nz(t.name)==='sdt');if(!tab)throw new Error('Không thấy tab SĐT');
  const F=tab.fields||[], fl=re=>F.find(f=>re.test(nz(f.label)));
  const fNum=fl(/^(so|sdt|sodienthoai)$/), fCar=fl(/^nhamang$/), fOwn=fl(/^sohuu$/), fHold=fl(/^(chusim|tenchusim)$/);
  if(!fNum)throw new Error('Tab SĐT không có trường "Số"');
  const die=(tab.statuses||[]).find(s=>/^(die|mat|chet)$/.test(nz(s.label)));if(!die)throw new Error('Tab SĐT không có trạng thái Die / Mất');
  // dòng hiện có của tab
  let rows=[],links=[],before=0;for(;;){const r=await get(`tab_chunk?tab=${tab.id}&before=${before}&n=20000`);rows.push(...r.accounts);links.push(...r.links);if(!r.next)break;before=r.next}
  const lc=new Map();for(const l of links){lc.set(l.src,(lc.get(l.src)||0)+1);lc.set(l.dst,(lc.get(l.dst)||0)+1)}
  const byNum=new Map();for(const a of rows){const n=ph((a.data||{})[fNum.id]);if(!n)continue;(byNum.get(n)||byNum.set(n,[]).get(n)).push(a)}
  // bộ phận / owner
  const D=m.depts, O=m.owners, dByKey=k=>{const want={rd:['rd','bophanrd','rnd'],tuyendung:['rec','tuyendung','recruit','recruitment'],sale:['sale','sales','kinhdoanh'],congtacvien:['congtacvien','ctv','parttime']}[k]||[k];return D.find(d=>want.includes(nz(d.name)))||D.find(d=>want.some(w=>nz(d.name).includes(w)))};
  const ownerOf=t=>{if(!t.owner)return null;const k=nz(t.owner),k2=nz(t.owner.replace(/\s+J\d+$/i,''));return O.find(o=>nz(o.name)===k)||O.find(o=>nz(o.name)===k2)||O.find(o=>nz(o.name).endsWith(k2)&&k2.length>=4)||null};
  const deptKey=t=>nz(t.dept);
  const ups=[],ins=[],warn=[],keep=new Set();
  for(const t of T){
    const o=ownerOf(t), dp=o?D.find(d=>d.id===o.dept_id):dByKey(deptKey(t));
    if(t.owner&&!o)warn.push(`${t.num}: chưa có owner "${t.owner}" trong HireX (${t.emp}) → giữ owner hiện tại / chỉ gán bộ phận`);
    if(!dp)warn.push(`${t.num}: không thấy bộ phận "${t.dept}"`);
    const data={[fNum.id]:t.num};if(fCar&&t.carrier)data[fCar.id]=t.carrier;if(fOwn)data[fOwn.id]=t.sohuu;if(fHold&&t.holder)data[fHold.id]=t.holder;
    const crm=(!fHold&&t.holder?`Tên trên CRM: ${t.holder}\n`:'')+t.note;
    const ex=(byNum.get(t.num)||[]).slice().sort((a,b)=>(lc.get(b.id)||0)-(lc.get(a.id)||0)||a.id-b.id);
    const tgt={t,o,dp,data,crm};
    if(ex.length){const a=ex[0];keep.add(a.id);ups.push({...tgt,a})}else ins.push(tgt);
  }
  const del=rows.filter(a=>!keep.has(a.id));
  P={tab,die,F:{fNum,fCar,fOwn,fHold},ups,ins,del,warn,rows,lc};
  return P;
}
function noteOf(old,crm){old=String(old||'');const i=old.indexOf(MARK);const head=(i>=0?old.slice(0,i):old).trim();return (head?head+'\n\n':'')+MARK+'\n'+crm}
function show(){
  const {tab,die,F,ups,ins,del,warn,rows,lc}=P, oname=x=>x.o?esc(x.o.name):'<span class="mu">—</span>', dname=x=>x.dp?esc(x.dp.name):'<span class="err">?</span>';
  const chg=x=>{const a=x.a,d=a.data||{},c=[];if(a.status_id!==die.id)c.push('→ Die');if(F.fOwn&&d[F.fOwn.id]!==x.t.sohuu)c.push('Sở hữu → '+x.t.sohuu);if(x.dp&&a.dept_id!==x.dp.id)c.push('bộ phận → '+x.dp.name);if(x.o&&a.owner_id!==x.o.id)c.push('owner → '+x.o.name);if(!x.o&&!x.t.owner&&a.owner_id)c.push('bỏ owner');if(F.fCar&&x.t.carrier&&d[F.fCar.id]!==x.t.carrier)c.push('nhà mạng → '+x.t.carrier);return c.join(' · ')||'ghi chú CRM'};
  $('#out').innerHTML=`
  <div class="kp"><div class="k"><span class="mu">Tab SĐT hiện có</span><b>${nf(rows.length)}</b></div><div class="k"><span class="mu">Cập nhật (số đã có)</span><b>${nf(ups.length)}</b></div>
  <div class="k"><span class="mu">Thêm mới</span><b>${nf(ins.length)}</b></div><div class="k"><span class="mu">Không có trong CRM → xoá</span><b>${nf(del.length)}</b></div>
  <div class="k"><span class="mu">Sau khi áp dụng</span><b>${nf(ups.length+ins.length)}</b></div></div>
  <p class="mu">Trạng thái đích: <b>${esc(die.label)}</b> · Trường dùng: Số${F.fCar?', Nhà mạng':''}${F.fOwn?', Sở hữu':' <span class="err">(tab chưa có trường Sở hữu!)</span>'}${F.fHold?', Chủ sim':''} · Ghi chú: giữ phần người dùng tự viết, thay phần sau “${MARK}”. Liên kết (Zalo / Email / FB…) của các số đã có được giữ nguyên.</p>
  ${warn.length?`<div class="card" style="margin-top:8px"><b class="err">Cần xem (${warn.length})</b><div class="log">${warn.map(esc).join('\n')}</div></div>`:''}
  ${del.length?`<h3>Sẽ xoá ${nf(del.length)} dòng không có trong danh sách CRM</h3><div class="sc"><table><tr><th>Số</th><th>Trạng thái</th><th>Liên kết</th><th>Ghi chú</th></tr>${del.map(a=>`<tr><td>${esc((a.data||{})[F.fNum.id]||'(trống)')}</td><td>${esc((P.st[a.status_id]||''))}</td><td>${lc.get(a.id)||0}</td><td class="mu">${esc(String(a.note||'').split(MARK)[0].slice(0,80))}</td></tr>`).join('')}</table></div>
   <p class="row"><label><input type="checkbox" id="dodel" checked> Xoá ${nf(del.length)} dòng này (có bản sao lưu trước khi ghi — khôi phục được trong Cài đặt › Sao lưu)</label></p>`:''}
  <h3>${nf(ups.length+ins.length)} số theo CRM</h3><div class="sc"><table><tr><th>#</th><th>Số</th><th>Việc</th><th>Sở hữu</th><th>Bộ phận</th><th>Owner</th><th>Thay đổi</th></tr>
  ${[...ins.map(x=>[x,'<span class="tag n">thêm</span>','dòng mới']),...ups.map(x=>[x,'<span class="tag">cập nhật</span>',chg(x)])].map(([x,v,c],i)=>`<tr><td class="mu">${i+1}</td><td>${esc(x.t.num)}</td><td>${v}</td><td>${esc(x.t.sohuu)}</td><td>${dname(x)}</td><td>${oname(x)}</td><td class="mu">${esc(c)}</td></tr>`).join('')}</table></div>
  <div class="row" style="margin-top:14px"><button class="p" id="go">Áp dụng</button><span class="mu">Chụp bản sao lưu → cập nhật → thêm → xoá. Khoảng 10–30 giây.</span></div>`;
  $('#go').onclick=apply;
}
async function apply(){
  const btn=$('#go');btn.disabled=true;const {tab,die,ups,ins,del}=P, dodel=!$('#dodel')||$('#dodel').checked;
  $('#out').insertAdjacentHTML('beforeend','<div class="card"><b id="ph">Đang chạy…</b><div class="bar"><i id="pb"></i></div><div class="log" id="lg"></div></div>');
  const lg=(s,c='')=>{$('#lg').insertAdjacentHTML('beforeend',`<div class="${c}">${esc(s)}</div>`)}, pb=p=>$('#pb').style.width=p+'%';
  try{
    lg('1/4 Chụp bản sao lưu…');await post('backup_now',{});pb(10);lg('   ✓ đã sao lưu','okc');
    if(ups.length){
      lg(`2/4 Cập nhật ${ups.length} số đã có…`);
      const items=ups.map(x=>{const it={id:x.a.id,data:x.data,note:noteOf(x.a.note,x.crm),status_id:die.id};if(x.o)it.owner_id=x.o.id;return it});
      const r=await post('rows_set',{items});pb(40);lg(`   ✓ cập nhật ${r.updated??items.length} dòng`,'okc');
      // không owner (kho R&D…) hoặc owner chưa có trong HireX: chỉ gán bộ phận, bỏ owner cũ nếu CRM không có owner
      const g=new Map();for(const x of ups){if(x.o||!x.dp)continue;const k=x.dp.id+'|'+(x.t.owner?'keep':'none');(g.get(k)||g.set(k,[]).get(k)).push(x.a.id)}
      for(const [k,ids] of g){const [dept,mode]=k.split('|');if(mode==='none')await post('mass_set',{ids,set_owner:1,owner_id:null,dept_id:+dept});}
      pb(55);lg('   ✓ bộ phận / owner','okc');
    }
    if(ins.length){
      lg(`3/4 Thêm ${ins.length} số mới…`);let n=0;
      for(const x of ins){await post('account',{tab_id:tab.id,dept_id:x.dp?x.dp.id:null,owner_id:x.o?x.o.id:null,status_id:die.id,device_id:null,note:noteOf('',x.crm),data:x.data});n++;pb(55+25*n/ins.length)}
      lg(`   ✓ thêm ${n} dòng`,'okc');
    }
    if(del.length&&dodel){lg(`4/4 Xoá ${del.length} dòng không có trong CRM…`);await post('delete_accounts',{ids:del.map(a=>a.id)});lg(`   ✓ đã xoá ${del.length} dòng`,'okc')}
    else lg('4/4 Không xoá dòng nào');
    pb(100);
    const chk=await plan();
    $('#ph').innerHTML=`<span class="okc">Xong.</span> Tab SĐT giờ có ${nf(chk.rows.length)} dòng · khớp CRM: ${nf(chk.ups.length)}/${nf(T.length)} · còn thiếu: ${nf(chk.ins.length)} · dòng thừa: ${nf(chk.del.length)}`;
    lg('Mở lại trang Tài nguyên (hoặc đợi vài giây — bảng tự cập nhật).');
  }catch(e){$('#ph').innerHTML='<span class="err">Dừng vì lỗi: '+esc(e.message)+'</span> — phần đã ghi vẫn giữ; bấm tải lại trang này để xem tình trạng và chạy tiếp.';lg(String(e.message),'err');btn.disabled=false}
}
(async()=>{try{await plan();P.st=Object.fromEntries((P.tab.statuses||[]).map(s=>[s.id,s.label]));show()}catch(e){$('#out').innerHTML='<span class="err">'+esc(e.message)+'</span>'}})();
</script></body></html>
